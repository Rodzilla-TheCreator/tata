<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pasillo 3.18 · EDR18N2</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#2d333b;--tx:#e6edf3;--mu:#8b949e;
  --rack:#d29922;--post:#6e4a12;--truck:#4f9dfb;--fork:#c9d1d9;--ok:#3fb950;--warn:#e3b341;--bad:#e5484d;--floor:#1b2028}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f8fa;--panel:#fff;--line:#d0d7de;--tx:#1f2328;--mu:#59636e;
  --rack:#bf8700;--post:#7d4e00;--truck:#0969da;--fork:#57606a;--floor:#eaeef2}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto;padding:0 12px}
header{padding:10px 0 6px}
h1{font-size:16px;margin:0}
.sub{color:var(--mu);font-size:12px}
#stage{flex:1;display:flex;gap:10px;min-height:0}
#cv{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;touch-action:none}
#side{width:118px;display:flex;flex-direction:column;gap:8px}
#elev{width:100%;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.k{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.v{font-variant-numeric:tabular-nums;font-weight:600}
#ctl{display:flex;gap:8px;padding:10px 0;flex-wrap:wrap;align-items:center}
button{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
button.on{border-color:var(--truck);color:var(--truck)}
#est{font-weight:600}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Pasillo 3.18 m · EDR18N2 · almacén nuevo</h1>
    <div class="sub">20 bahías por lado · 2.35 m + postes de 6" · 4 niveles · vista en planta, escala real</div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="side">
      <div class="card"><div class="k">Estado</div><div id="est">—</div></div>
      <div class="card"><div class="k">Destino</div><div class="v" id="dst">—</div></div>
      <div class="card"><div class="k">Holgura</div><div class="v" id="hol">—</div></div>
      <canvas id="elev"></canvas>
    </div>
  </div>
  <div id="ctl">
    <button id="bp">Pausa</button>
    <button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button>
    <span class="sub" id="pie"></span>
  </div>
</div>
<script>
/* Datos: pasillo y racks del almacén nuevo (12-oct-2026, dados por maje).
   Maniobra: planificar_giro_318.py (Hybrid A*, silueta CON uñas). */
const GIRO = __GIRO__;
const A = { ANCHO:3.18, BAHIA:2.35, POSTE:0.1524, N:20, NIV:4, FONDO:1.10 /* supuesto */ };
const T = { XPIV:1.50, LCH:1.70, WB:1.562, WMAX:1.315, WCPO:1.065, FLEN:1.20, REACH:0.61, DMAX:78*Math.PI/180 };
const LARGO = A.N*A.BAHIA + (A.N+1)*A.POSTE;   // 50.20 m
const V_VIAJE = 1.5, V_MAN = 0.35, V_PANT = 0.25, V_ELEV = 0.45;

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const ev = document.getElementById('elev'), ex = ev.getContext('2d');
let DPR = 1;
function fit(){ DPR = window.devicePixelRatio||1;
  for (const c of [cv,ev]){ const r=c.getBoundingClientRect(); c.width=r.width*DPR; c.height=r.height*DPR; } }
addEventListener('resize', fit);

/* ── geometría ───────────────────────────────────────────────────────── */
const A_CULO=-T.XPIV, A_MAST=-(T.XPIV-T.LCH), A_PUNTA=A_MAST+T.FLEN;
function cuerpo(){ const hc=T.WCPO/2, hp=T.WMAX/2;
  return [[A_CULO,hc],[A_MAST,hc],[A_MAST,hp],[A_MAST+.9,hp],[A_MAST+.9,-hp],[A_MAST,-hp],[A_MAST,-hc],[A_CULO,-hc]]; }
const CUERPO = cuerpo();
const UNAS = [-1,1].map(s=>[[0,s*.235],[T.FLEN,s*.235],[T.FLEN,s*.365],[0,s*.365]]);
// centro de cada hueco: 2 posiciones por bahía (supuesto, como en RETHINK)
function huecoX(b,h){ const x0 = A.POSTE + b*(A.BAHIA+A.POSTE); return x0 + A.BAHIA*(h?0.75:0.25); }

function aPlano(p, pts){ const c=Math.cos(p.th), s=Math.sin(p.th);
  return pts.map(([a,l])=>[p.x+a*c-l*s, p.y+a*s+l*c]); }
function holgura(p){ const pts=aPlano(p,[...CUERPO,[A_PUNTA,.365],[A_PUNTA,-.365]]);
  let m=1e9; for(const [,y] of pts) m=Math.min(m,y,A.ANCHO-y); return m; }

/* lado B = rack en y=ANCHO (como sale del planificador). Lado A = espejo. */
function poseGiro(i, lado){ const q=GIRO.poses[i];
  return lado==='B' ? {x:q[0], y:q[1], th:q[2]} : {x:q[0], y:A.ANCHO-q[1], th:-q[2]}; }
const XF = GIRO.poses[GIRO.poses.length-1][0];

/* ── misión: lista de tareas, se encadenan en lazo ─────────────────────── */
function tareas(){ const L=[]; let r=7;
  const rnd=()=> (r=(r*1103515245+12345)%2147483648)/2147483648;
  for(let i=0;i<14;i++) L.push({lado:rnd()<.5?'A':'B', b:Math.floor(rnd()*A.N), h:rnd()<.5?0:1, niv:1+Math.floor(rnd()*A.NIV)});
  return L; }
const TAREAS = tareas();

/* Cada tarea se expande en pasos simples que se interpolan. */
function pasos(t){
  const xs = huecoX(t.b,t.h) - XF, lado=t.lado, y0=poseGiro(0,lado).y;
  const P = [];
  P.push({tipo:'viaje', y:y0, x:xs});
  P.push({tipo:'giro', lado, x0:xs, sentido:1});
  P.push({tipo:'elev', h:t.niv-1});
  P.push({tipo:'pant', r:T.REACH});
  P.push({tipo:'elev', h:t.niv-1+0.12});
  P.push({tipo:'pant', r:0});
  P.push({tipo:'elev', h:0});
  P.push({tipo:'giro', lado, x0:xs, sentido:-1});
  return P;
}
const fmt = t => `${t.lado}-${String(t.b+1).padStart(2,'0')}-${t.h?'D':'I'} · N${t.niv}`;

/* ── estado ──────────────────────────────────────────────────────────── */
const S = { p:{x:-3, y:poseGiro(0,'B').y, th:0}, reach:0, lift:0, ti:0, pi:0, prog:0,
            pasos:pasos(TAREAS[0]), vel:1, pausa:false, hmin:1e9, carga:false, ciclos:0 };
const EST = { viaje:'Viajando', giro:'Girando 90°', elev:'Elevando', pant:'Pantógrafo' };

function avanza(dt){
  let paso = S.pasos[S.pi];
  if(!paso){ S.ti=(S.ti+1)%TAREAS.length; S.pasos=pasos(TAREAS[S.ti]); S.pi=0; S.ciclos++; S.hmin=1e9; return; }
  const sig=()=>{ S.pi++; S.prog=0; };
  if(paso.tipo==='viaje'){
    // primero se ajusta el carril lateral (deriva suave), luego avanza recto
    const dy=paso.y-S.p.y, dxv=paso.x-S.p.x;
    if(Math.abs(dy)>.005 && Math.abs(dxv)>.3){   // cambio de carril en S suave, rumbo = dirección de avance
      const vx=Math.sign(dxv)*Math.min(Math.abs(dxv),.6*dt), vy=Math.sign(dy)*Math.min(Math.abs(dy),.12*dt);
      S.p.x+=vx; S.p.y+=vy; S.p.th = vx>=0? Math.atan2(vy,vx) : Math.atan2(-vy,-vx); return; }
    if(Math.abs(dy)>.005){ S.p.y+=Math.sign(dy)*Math.min(Math.abs(dy),.12*dt); }
    const d=Math.min(Math.abs(dxv), V_VIAJE*dt*Math.min(1,Math.abs(dxv)/1.2+.15));
    S.p.x+=Math.sign(dxv)*d; S.p.th=0; if(Math.abs(dxv)<.003){ S.p.x=paso.x; sig(); }
  } else if(paso.tipo==='giro'){
    const n=GIRO.poses.length-1, ds=0.04;
    S.prog += V_MAN*dt/ds;
    if(S.prog>=n){ S.prog=n; }
    const f=S.prog, i=Math.min(n-1,Math.floor(f)), u=f-i;
    const k0 = paso.sentido>0? i : n-i, k1 = paso.sentido>0? i+1 : n-i-1;
    const a=poseGiro(k0,paso.lado), b=poseGiro(k1,paso.lado);
    S.p={x:paso.x0+a.x+(b.x-a.x)*u, y:a.y+(b.y-a.y)*u, th:a.th+(b.th-a.th)*u};
    S.hmin=Math.min(S.hmin,holgura(S.p));
    if(S.prog>=n) sig();
  } else if(paso.tipo==='elev'){
    const d=paso.h-S.lift, st=V_ELEV*dt; S.lift+= Math.abs(d)<st? d : Math.sign(d)*st;
    if(Math.abs(paso.h-S.lift)<1e-4) sig();
  } else if(paso.tipo==='pant'){
    const d=paso.r-S.reach, st=V_PANT*dt; S.reach+= Math.abs(d)<st? d : Math.sign(d)*st;
    if(Math.abs(paso.r-S.reach)<1e-4){ if(paso.r===0) S.carga=!S.carga; sig(); }
  }
}

/* ── dibujo en planta ────────────────────────────────────────────────── */
function dibuja(){
  const W=cv.width, H=cv.height; cx.setTransform(1,0,0,1,0,0); cx.clearRect(0,0,W,H);
  const anchoTot = A.ANCHO + 2*A.FONDO + 0.6;
  const k = Math.min(W/anchoTot, H/7.5);        // px por metro
  const ox = W/2 - (A.ANCHO/2)*k;                // y lateral → pantalla x
  const camX = Math.max(-2, Math.min(LARGO+1, S.p.x));
  const toS = (x,y)=>[ox + y*k, H*0.62 - (x-camX)*k];
  cx.save();
  // piso del pasillo
  cx.fillStyle=css('--floor'); let [a0,b0]=toS(-4,0), [a1,b1]=toS(LARGO+3,A.ANCHO);
  cx.fillRect(a0,b1,a1-a0,b0-b1);
  // racks
  for(const lado of ['A','B']){
    const y0 = lado==='A'? -A.FONDO : A.ANCHO, y1 = y0+A.FONDO;
    for(let b=0;b<A.N;b++){
      const x0=A.POSTE+b*(A.BAHIA+A.POSTE), x1=x0+A.BAHIA;
      let [p,q]=toS(x0,y0),[r,s]=toS(x1,y1);
      cx.fillStyle=css('--rack'); cx.globalAlpha=.16; cx.fillRect(p,s,r-p,q-s); cx.globalAlpha=1;
      cx.strokeStyle=css('--rack'); cx.lineWidth=1.2*DPR; cx.strokeRect(p,s,r-p,q-s);
      cx.fillStyle=css('--mu'); cx.font=`${10*DPR}px system-ui`; cx.textAlign='center';
      const [lx,ly]=toS((x0+x1)/2, lado==='A'? -A.FONDO/2 : A.ANCHO+A.FONDO/2);
      cx.fillText(`${lado}${b+1}`, lx, ly+4*DPR);
    }
    for(let b=0;b<=A.N;b++){ const x0=b*(A.BAHIA+A.POSTE);
      let [p,q]=toS(x0,y0),[r,s]=toS(x0+A.POSTE,y1); cx.fillStyle=css('--post'); cx.fillRect(p,s,r-p,q-s); }
  }
  // destino resaltado
  const t=TAREAS[S.ti], xc=huecoX(t.b,t.h);
  { const y0 = t.lado==='A'? -A.FONDO : A.ANCHO; let [p,q]=toS(xc-.5,y0),[r,s]=toS(xc+.5,y0+A.FONDO);
    cx.strokeStyle=css('--ok'); cx.lineWidth=2.5*DPR; cx.setLineDash([5*DPR,4*DPR]); cx.strokeRect(p,s,r-p,q-s); cx.setLineDash([]); }
  // montacargas
  const poly=(pts,fill,stroke)=>{ cx.beginPath(); pts.forEach(([x,y],i)=>{ const [u,v]=toS(x,y); i?cx.lineTo(u,v):cx.moveTo(u,v); });
    cx.closePath(); if(fill){cx.fillStyle=fill; cx.fill();} if(stroke){cx.strokeStyle=stroke; cx.lineWidth=1.2*DPR; cx.stroke();} };
  const p=S.p, uOff = A_MAST + S.reach;
  poly(aPlano(p,CUERPO), css('--truck')+'cc', css('--truck'));
  for(const u of UNAS) poly(aPlano(p,u.map(([a,l])=>[a+uOff,l])), css('--fork'));
  if(S.carga) poly(aPlano(p,[[uOff+.1,-.5],[uOff+1.2,-.5],[uOff+1.2,.5],[uOff+.1,.5]]), null, css('--ok'));
  // cabina / techo, para leer el rumbo
  poly(aPlano(p,[[A_CULO+.15,-.35],[A_CULO+.75,-.35],[A_CULO+.75,.35],[A_CULO+.15,.35]]), '#0005');
  // cota del ancho del pasillo
  cx.strokeStyle=css('--mu'); cx.lineWidth=1*DPR; let [m0,n0]=toS(camX-2.6,0),[m1]=toS(camX-2.6,A.ANCHO);
  cx.beginPath(); cx.moveTo(m0,n0); cx.lineTo(m1,n0); cx.stroke();
  cx.fillStyle=css('--tx'); cx.font=`600 ${11*DPR}px system-ui`; cx.textAlign='center'; cx.fillText('3.18 m',(m0+m1)/2,n0-5*DPR);
  cx.restore();
}

/* ── alzado del rack de destino: 4 niveles, sin escala vertical ───────── */
function alzado(){
  const W=ev.width, H=ev.height; ex.setTransform(1,0,0,1,0,0); ex.clearRect(0,0,W,H);
  const pad=10*DPR, top=pad+14*DPR, bot=H-pad, h=(bot-top)/A.NIV;
  ex.fillStyle=css('--mu'); ex.font=`${10*DPR}px system-ui`; ex.textAlign='left';
  ex.fillText('Alzado', pad, pad+6*DPR);
  ex.strokeStyle=css('--rack'); ex.lineWidth=2*DPR;
  for(let i=0;i<=A.NIV;i++){ const y=bot-i*h; ex.beginPath(); ex.moveTo(pad,y); ex.lineTo(W-pad,y); ex.stroke(); }
  const t=TAREAS[S.ti];
  for(let n=1;n<=A.NIV;n++){ ex.fillStyle = n===t.niv? css('--ok') : css('--mu');
    ex.fillText('N'+n, pad+2*DPR, bot-(n-1)*h-6*DPR); }
  const yy = bot - S.lift*h - 2*DPR;   // N1 al piso; cada nivel = un paso, sin escala
  ex.fillStyle=css('--fork'); ex.fillRect(W*0.35, yy-4*DPR, W*0.5, 4*DPR);
  if(S.carga){ ex.strokeStyle=css('--ok'); ex.strokeRect(W*0.4, yy-4*DPR-h*0.7, W*0.4, h*0.7); }
}

function hud(){
  const paso=S.pasos[S.pi]; document.getElementById('est').textContent = paso? EST[paso.tipo] : '—';
  document.getElementById('dst').textContent = fmt(TAREAS[S.ti]);
  const h=document.getElementById('hol');
  if(S.hmin<1e8){ h.textContent=(S.hmin*100).toFixed(1)+' cm'; h.style.color = S.hmin<.08? css('--warn') : css('--ok'); }
  else { h.textContent='—'; h.style.color=''; }
  document.getElementById('pie').textContent =
    `Giro: ${GIRO.cambios_sentido} cambios de sentido · holgura mín. planificada ${(GIRO.holgura_min*100).toFixed(1)} cm · ciclos ${S.ciclos}`;
}

let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now;
  if(!S.pausa) for(let i=0;i<S.vel;i++) avanza(dt);
  dibuja(); alzado(); hud(); requestAnimationFrame(loop); }
fit(); requestAnimationFrame(loop);

document.getElementById('bp').onclick=e=>{ S.pausa=!S.pausa; e.target.textContent=S.pausa?'Seguir':'Pausa'; };
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ S.vel=+b.dataset.s;
  document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b)); });
</script>
</body>
</html>
