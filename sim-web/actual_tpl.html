<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TaTa · RETHINK actual</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1016;color:#e6edf3;
  font:14px/1.5 ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#cv{position:fixed;inset:0;display:block}
.panel{position:fixed;background:rgba(13,19,26,.93);border:1px solid #2a3945;
  border-radius:6px;padding:12px 14px;backdrop-filter:blur(8px)}
#hud{top:14px;left:14px;max-width:290px}
#ctl{top:14px;right:14px;width:214px;max-height:calc(100% - 28px);overflow:auto}
h1{font-size:15px;margin:0 0 3px;font-weight:700;letter-spacing:-.01em}
.sub{font:600 10px/1.4 ui-monospace,monospace;letter-spacing:.11em;text-transform:uppercase;color:#7d91a2}
.kv{display:flex;justify-content:space-between;gap:12px;font:400 12.5px/1.7 ui-monospace,monospace}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
hr{border:0;border-top:1px solid #2a3945;margin:10px 0}
button{width:100%;text-align:left;background:#1b2732;border:1px solid #2a3945;color:#e6edf3;
  border-radius:4px;padding:7px 10px;margin:3px 0;cursor:pointer;font:inherit;font-size:12.5px}
button:hover{border-color:#f0a93b}
button.on{background:#f0a93b;color:#0b1016;border-color:#f0a93b;font-weight:700}
button:focus-visible{outline:2px solid #f0a93b;outline-offset:1px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:-1px}
#help{position:fixed;bottom:14px;left:14px;color:#7d91a2;font-size:12px}
kbd{background:#1b2732;border:1px solid #2a3945;border-bottom-width:2px;border-radius:3px;
  padding:1px 5px;font:600 11px ui-monospace,monospace;color:#e6edf3}
.warn{color:#e4644a}.ok{color:#3bb5ac}.mid{color:#f0a93b}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="panel" id="hud">
  <div class="sub">RETHINK &middot; sector A &middot; disposici&oacute;n actual</div>
  <h1 id="h_tit">Vista general</h1>
  <hr>
  <div class="kv"><span>Unidad</span><b id="h_uni">&mdash;</b></div>
  <div class="kv"><span>Velocidad</span><b id="h_vel">0.00 m/s</b></div>
  <div class="kv"><span>Direcci&oacute;n</span><b id="h_dir">0&deg;</b></div>
  <div class="kv"><span>Holgura m&iacute;n.</span><b id="h_hol">&mdash;</b></div>
  <div class="kv"><span>Golpes</span><b id="h_hit">0</b></div>
</div>

<div class="panel" id="ctl">
  <div class="sub">Unidad</div>
  <div id="c_uni"></div>
  <hr>
  <div class="sub">Ir a pasillo</div>
  <div id="c_pas"></div>
  <hr>
  <div class="sub">Vista</div>
  <div id="c_vis"></div>
  <hr>
  <div class="sub">Capas</div>
  <div id="c_cap"></div>
</div>

<div id="help">
  <kbd>W</kbd><kbd>S</kbd> avanzar &middot; <kbd>A</kbd><kbd>D</kbd> dirigir &middot;
  <kbd>Q</kbd><kbd>E</kbd> mástil &middot; <kbd>Espacio</kbd> freno &middot;
  <kbd>Tab</kbd> cambiar unidad &middot; arrastrar para orbitar
</div>

<script>__THREE__</script>
<script>
const D = __DATA__;

/* ── marco: el DWG viene en metros, lo centro en el sector ─────────────── */
const CX = (D.bounds.x0 + D.bounds.x1) / 2, CY = (D.bounds.y0 + D.bounds.y1) / 2;
const tx = x => x - CX, tz = y => -(y - CY);

const COL = { rojo:0xe5484d, amarillo:0xe3b341, verde:0x3fb950, azul:0x4f9dfb };
const LVL = D.LVL, CUBE = D.CUBE;

/* ── cotas del EDR18N2. Ver analisis/planificador_giro.py ───────────────── */
const T = {
  XPIV: 1.50,      // culo -> eje de ruedas de carga (DERIVADO del Wa de ficha)
  LCH : 1.70,      // culo -> cara del mastil
  WB  : 1.562,     // entre ejes (ficha)
  WMAX: 1.315,     // punto mas ancho: patas portantes
  WCPO: 1.065,     // capo trasero, 25 cm mas angosto
  FLEN: 1.20,      // largo util de uña
  DMAX: 78 * Math.PI / 180,
  VMAX: 1.50, VMAN: 0.35, ACC: 0.9, LIFT: 6.7,
};

/* ── escena ─────────────────────────────────────────────────────────────── */
const cv = document.getElementById('cv');
const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2));
const SC = new THREE.Scene();
SC.background = new THREE.Color(0x0b1016);
SC.fog = new THREE.Fog(0x0b1016, 44, 108);
const CAM = new THREE.PerspectiveCamera(52, 1, 0.1, 400);

SC.add(new THREE.HemisphereLight(0xbcd4e8, 0x20262e, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.55);
sun.position.set(24, 40, 16); SC.add(sun);

const G = { racks: new THREE.Group(), muros: new THREE.Group(),
            cubos: new THREE.Group(), cols: new THREE.Group() };
Object.values(G).forEach(g => SC.add(g));

const OBB = [];   // colisionadores: {cx,cz,hx,hz}
const push = (cx, cz, hx, hz) => OBB.push({ cx, cz, hx, hz });

/* piso */
const ext = { x: D.bounds.x1 - D.bounds.x0, z: D.bounds.y1 - D.bounds.y0 };
const piso = new THREE.Mesh(
  new THREE.PlaneGeometry(ext.x + 8, ext.z + 8),
  new THREE.MeshStandardMaterial({ color: 0x252d36, roughness: .97 }));
piso.rotation.x = -Math.PI / 2; SC.add(piso);

/* muros */
{
  const m = new THREE.MeshStandardMaterial({ color: 0x46525e, roughness: .93 });
  D.walls.forEach(w => {
    const ax = tx(w[0]), az = tz(w[1]), bx = tx(w[2]), bz = tz(w[3]);
    const dx = bx - ax, dz = bz - az, L = Math.hypot(dx, dz);
    if (L < 0.05) return;
    const g = new THREE.Mesh(new THREE.BoxGeometry(L, 3.2, 0.16), m);
    g.position.set((ax + bx) / 2, 1.6, (az + bz) / 2);
    g.rotation.y = -Math.atan2(dz, dx);
    G.muros.add(g);
    push((ax + bx) / 2, (az + bz) / 2, Math.max(L / 2, .08), .08);
  });
}

/* columnas */
{
  const m = new THREE.MeshStandardMaterial({ color: 0x5b6873, roughness: .9 });
  (D.columns || []).forEach(c => {
    const g = new THREE.Mesh(new THREE.BoxGeometry(.42, 7.2, .42), m);
    g.position.set(tx(c.x), 3.6, tz(c.y)); G.cols.add(g);
    push(tx(c.x), tz(c.y), .21, .21);
  });
}

/* racks + maxicubos */
const NIV = LVL.length;
{
  const mPost = new THREE.MeshStandardMaterial({ color: 0x3d5570, roughness: .8, metalness: .3 });
  const mViga = new THREE.MeshStandardMaterial({ color: 0xc4601f, roughness: .75 });
  const gCubo = new THREE.BoxGeometry(CUBE.d, CUBE.h, CUBE.w);   // d va en X del rack
  D.racks.forEach(r => {
    const zc = tz(r.y), alto = LVL[NIV - 1] + 1.0;
    const nb = Math.max(1, Math.round((r.x1 - r.x0) / CUBE.d));
    // parales
    for (let i = 0; i <= nb; i++) {
      const p = new THREE.Mesh(new THREE.BoxGeometry(.09, alto, r.cd), mPost);
      p.position.set(tx(r.x0 + i * CUBE.d), alto / 2, zc); G.racks.add(p);
    }
    // vigas por nivel
    LVL.forEach((h, li) => {
      if (li === 0) return;
      [-1, 1].forEach(s => {
        const v = new THREE.Mesh(new THREE.BoxGeometry(r.x1 - r.x0, .10, .06), mViga);
        v.position.set(tx((r.x0 + r.x1) / 2), h, zc + s * (r.cd / 2 - .05));
        G.racks.add(v);
      });
    });
    push(tx((r.x0 + r.x1) / 2), zc, (r.x1 - r.x0) / 2, r.cd / 2);

    // maxicubos: color si la fila esta marcada, gris si no
    const c = r.color ? COL[r.color] : 0x8a949e;
    const mc = new THREE.MeshStandardMaterial({ color: c, roughness: .68,
      transparent: !r.color, opacity: r.color ? 1 : .55 });
    for (let i = 0; i < nb; i++)
      LVL.forEach(h => {
        if (Math.random() > .82) return;                 // huecos, como en la vida
        const b = new THREE.Mesh(gCubo, mc);
        b.position.set(tx(r.x0 + (i + .5) * CUBE.d), h + CUBE.h / 2, zc);
        G.cubos.add(b);
      });
  });
}

/* ── silueta del equipo, en planta ──────────────────────────────────────── */
function silueta() {
  const a0 = -T.XPIV, a1 = -(T.XPIV - T.LCH), hb = T.WCPO / 2, hp = T.WMAX / 2;
  return [[a0, hb], [a1, hb], [a1, hp], [a1 + .9, hp], [a1 + .9, -hp],
          [a1, -hp], [a1, -hb], [a0, -hb]];
}

function armarEquipo(color) {
  const g = new THREE.Group();
  const mCap = new THREE.MeshStandardMaterial({ color, roughness: .55, metalness: .15 });
  const mNeg = new THREE.MeshStandardMaterial({ color: 0x1d242c, roughness: .8 });
  const mUna = new THREE.MeshStandardMaterial({ color: 0x9aa5ae, roughness: .5, metalness: .5 });

  const capo = new THREE.Mesh(new THREE.BoxGeometry(T.LCH - .5, 1.42, T.WCPO), mCap);
  capo.position.set(-T.XPIV + (T.LCH - .5) / 2, .71, 0); g.add(capo);

  // patas portantes: el punto mas ancho, adelante y bajo
  [-1, 1].forEach(s => {
    const p = new THREE.Mesh(new THREE.BoxGeometry(1.35, .17, .18), mNeg);
    p.position.set(-(T.XPIV - T.LCH) + .5, .085, s * (T.WMAX / 2 - .09)); g.add(p);
  });

  const mast = new THREE.Mesh(new THREE.BoxGeometry(.16, 2.6, .9), mNeg);
  mast.position.set(-(T.XPIV - T.LCH), 1.3, 0); g.add(mast);

  const carro = new THREE.Group(); g.add(carro);
  [-1, 1].forEach(s => {
    const u = new THREE.Mesh(new THREE.BoxGeometry(T.FLEN, .036, .13), mUna);
    u.position.set(-(T.XPIV - T.LCH) + T.FLEN / 2, .018, s * .30); carro.add(u);
  });
  const techo = new THREE.Mesh(new THREE.BoxGeometry(1.5, .07, T.WCPO), mNeg);
  techo.position.set(-T.XPIV + .8, 2.24, 0); g.add(techo);

  g.userData = { carro, sil: silueta() };
  SC.add(g); return g;
}

/* ── unidades ───────────────────────────────────────────────────────────── */
const PAS = D.pasillos;
function crearUnidad(nom, color, ip) {
  const p = PAS[Math.min(ip, PAS.length - 1)];
  return { nom, color, mesh: armarEquipo(color),
           x: tx((D.bounds.x0 + D.bounds.x1) / 2), z: tz(p.y), th: 0,
           v: 0, steer: 0, lift: LVL[0], hits: 0, hol: 9 };
}
const U = [crearUnidad('TaTa A', 0x3bb5ac, 0), crearUnidad('TaTa B', 0xf0a93b, 1)];
let act = 0;

/* ── cinematica: direccion trasera, referencia en el eje de carga ───────── */
const IN = { f: 0, s: 0, brake: false, lift: 0 };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'arrowup') IN.f = 1;
  if (k === 's' || k === 'arrowdown') IN.f = -1;
  if (k === 'a' || k === 'arrowleft') IN.s = 1;
  if (k === 'd' || k === 'arrowright') IN.s = -1;
  if (k === 'q') IN.lift = 1;
  if (k === 'e') IN.lift = -1;
  if (k === ' ') { IN.brake = true; e.preventDefault(); }
  if (k === 'tab') { act = (act + 1) % U.length; pintar(); e.preventDefault(); }
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (['w', 's', 'arrowup', 'arrowdown'].includes(k)) IN.f = 0;
  if (['a', 'd', 'arrowleft', 'arrowright'].includes(k)) IN.s = 0;
  if (k === 'q' || k === 'e') IN.lift = 0;
  if (k === ' ') IN.brake = false;
});

function puntosMundo(u) {
  const c = Math.cos(u.th), s = Math.sin(u.th);
  return u.mesh.userData.sil.map(([a, l]) => [u.x + a * c - l * s, u.z + a * s + l * c]);
}
function choca(pts) {
  for (const o of OBB)
    for (const [px, pz] of pts)
      if (Math.abs(px - o.cx) < o.hx && Math.abs(pz - o.cz) < o.hz) return true;
  return false;
}
function holgura(pts) {
  let m = 9;
  for (const o of OBB)
    for (const [px, pz] of pts) {
      const dx = Math.abs(px - o.cx) - o.hx, dz = Math.abs(pz - o.cz) - o.hz;
      if (dx < 0 && dz < 0) return 0;
      m = Math.min(m, Math.max(dx, dz));
    }
  return m;
}

function mover(u, dt) {
  const objetivo = IN.s * T.DMAX;
  u.steer += (objetivo - u.steer) * Math.min(1, dt * 4.5);
  if (IN.brake) u.v *= Math.pow(0.015, dt);
  u.v += IN.f * T.ACC * dt;
  u.v *= Math.pow(0.5, dt);
  const lim = Math.abs(u.steer) > T.DMAX * .45 ? T.VMAN : T.VMAX;
  u.v = Math.max(-lim * .7, Math.min(lim, u.v));
  if (!IN.f && Math.abs(u.v) < .03) u.v = 0;

  const ds = u.v * dt;
  const dth = -(ds / T.WB) * Math.tan(u.steer);
  const th2 = u.th + dth * .5;
  const nx = u.x + ds * Math.cos(th2), nz = u.z + ds * Math.sin(th2);
  const guard = { ...u, x: nx, z: nz, th: u.th + dth };
  const pts = puntosMundo(guard);
  if (choca(pts)) { u.v = -u.v * .2; u.hits++; }
  else { u.x = nx; u.z = nz; u.th += dth; u.hol = holgura(pts); }

  u.lift = Math.max(LVL[0], Math.min(T.LIFT, u.lift + IN.lift * 1.5 * dt));
  u.mesh.position.set(u.x, 0, u.z);
  u.mesh.rotation.y = -u.th;
  u.mesh.userData.carro.position.y = u.lift;
}

/* ── camara ─────────────────────────────────────────────────────────────── */
let modo = 'orbita', rad = 34, yaw = -0.7, pit = 0.95;
const foco = new THREE.Vector3();
let drag = null;
cv.addEventListener('pointerdown', e => drag = { x: e.clientX, y: e.clientY });
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => {
  if (!drag) return;
  yaw -= (e.clientX - drag.x) * .005;
  pit = Math.max(.16, Math.min(1.45, pit - (e.clientY - drag.y) * .005));
  drag = { x: e.clientX, y: e.clientY };
});
cv.addEventListener('wheel', e => {
  rad = Math.max(6, Math.min(90, rad * (1 + Math.sign(e.deltaY) * .12)));
  e.preventDefault();
}, { passive: false });

function camara() {
  const u = U[act];
  if (modo === 'seguir') foco.lerp(new THREE.Vector3(u.x, 1.2, u.z), .12);
  else if (modo === 'orbita') foco.lerp(new THREE.Vector3(0, 1, 0), .06);
  if (modo === 'cabina') {
    const c = Math.cos(u.th), s = Math.sin(u.th);
    CAM.position.set(u.x - .6 * c, 2.05, u.z - .6 * s);
    CAM.lookAt(u.x + 6 * c, 1.5, u.z + 6 * s);
    return;
  }
  CAM.position.set(foco.x + rad * Math.sin(pit) * Math.cos(yaw), foco.y + rad * Math.cos(pit),
                   foco.z + rad * Math.sin(pit) * Math.sin(yaw));
  CAM.lookAt(foco);
}

/* ── UI ─────────────────────────────────────────────────────────────────── */
function boton(cont, txt, on, fn) {
  const b = document.createElement('button');
  b.innerHTML = txt; if (on) b.className = 'on';
  b.onclick = fn; cont.appendChild(b); return b;
}
function pintar() {
  const cu = document.getElementById('c_uni'); cu.innerHTML = '';
  U.forEach((u, i) => boton(cu,
    `<span class="sw" style="background:#${u.color.toString(16).padStart(6,'0')}"></span>${u.nom}`,
    i === act, () => { act = i; pintar(); }));
  const cp = document.getElementById('c_pas'); cp.innerHTML = '';
  PAS.forEach((p, i) => boton(cp, `Pasillo ${i + 1} &middot; ${p.libre.toFixed(2)} m`, false, () => {
    const u = U[act]; u.x = tx((D.bounds.x0 + D.bounds.x1) / 2); u.z = tz(p.y);
    u.th = 0; u.v = 0; u.steer = 0;
  }));
  const cv2 = document.getElementById('c_vis'); cv2.innerHTML = '';
  [['orbita', 'General'], ['seguir', 'Seguir unidad'], ['cabina', 'Cabina']].forEach(([k, n]) =>
    boton(cv2, n, modo === k, () => { modo = k; pintar(); }));
  const cc = document.getElementById('c_cap'); cc.innerHTML = '';
  [['cubos', 'Maxicubos'], ['racks', 'Racks'], ['muros', 'Muros'], ['cols', 'Columnas']]
    .forEach(([k, n]) => boton(cc, n, G[k].visible, () => { G[k].visible = !G[k].visible; pintar(); }));
  document.getElementById('h_tit').textContent =
    modo === 'orbita' ? 'Vista general' : U[act].nom;
}
pintar();

/* ── bucle ──────────────────────────────────────────────────────────────── */
let t0 = performance.now();
function loop(t) {
  const dt = Math.min(.05, (t - t0) / 1000); t0 = t;
  mover(U[act], dt);
  U.forEach((u, i) => { if (i !== act) { u.v *= .9; u.mesh.position.set(u.x, 0, u.z);
                                          u.mesh.rotation.y = -u.th; } });
  camara();
  const u = U[act];
  document.getElementById('h_uni').textContent = u.nom;
  document.getElementById('h_vel').textContent = Math.abs(u.v).toFixed(2) + ' m/s';
  document.getElementById('h_dir').textContent = (u.steer * 180 / Math.PI).toFixed(0) + '°';
  const hh = document.getElementById('h_hol');
  hh.textContent = u.hol > 8 ? '—' : (u.hol * 100).toFixed(0) + ' cm';
  hh.className = u.hol < .1 ? 'warn' : (u.hol < .3 ? 'mid' : 'ok');
  document.getElementById('h_hit').textContent = u.hits;
  R.render(SC, CAM);
  requestAnimationFrame(loop);
}
function medir() {
  R.setSize(innerWidth, innerHeight, false);
  CAM.aspect = innerWidth / innerHeight; CAM.updateProjectionMatrix();
}
addEventListener('resize', medir); medir();
requestAnimationFrame(loop);
</script>
</body>
</html>
