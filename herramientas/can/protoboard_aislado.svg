<text x="820.6000000000001" y="800" font-size="12" text-anchor="start" font-weight="normal" fill="#222">GND_bus</text>
<text x="30" y="824" font-size="12" text-anchor="start" font-weight="normal" fill="#222">• VDD1 a 3V3, NUNCA a 5 V: VOA sale al GPIO21 con lo que haya en VDD1.   • TX: GPIO22 → VIB → VOB → TX.   • RX: RX → VIA → VOA → GPIO21.   • B0505S: 1 GND · 2 Vin · 3 0V · 4 +Vo.</text>
<text x="30" y="844" font-size="12" text-anchor="start" font-weight="normal" fill="#222">• En el montacargas (no hoy): CANH → DB9 8, CANL → DB9 3, GND_bus → negativo de batería (ficha del multipiloto, pin 7). El GND del ESP nunca va ahí.</text>
<text x="30" y="864" font-size="12" text-anchor="start" font-weight="normal" fill="#222">• Si el ADuM no entra a caballo del canal, ponelo donde quepa: cuentan las conexiones, y que nada del lado 2 toque un riel de arriba. La barrera solo la cruzan el B0505S y el ADuM1201.</text>
</svg>