<text x="30" y="34" font-size="22" text-anchor="start" font-weight="bold" fill="#222">CAN aislado en protoboard — ADuM1201 + B0505S + TJA1050</text>
<text x="30" y="56" font-size="13" text-anchor="start" font-weight="normal" fill="#444">Rieles de ARRIBA = lado ESP (GND = amarillo). Rieles de ABAJO = lado bus (GND_bus = negativo de batería). Ningún cable une arriba con abajo.</text>
