<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" font-family="Helvetica,Arial,sans-serif">
<rect width="1240" height="900" fill="#fbfbf8"/>
<text x="40" y="46" font-size="24" font-weight="bold" fill="#111">Cadena de escucha CAN — variante MCP2515</text>
<text x="40" y="70" font-size="14" fill="#555">Para cuando no se consigue el SN65HVD230. El MCP2515 trae su propio controlador CAN por SPI, y el problema es que es de 5 V.</text>
<line x1="40" y1="84" x2="1200" y2="84" stroke="#ccc"/>

<!-- equipo -->
<text x="50" y="116" font-size="13" font-weight="bold" fill="#777">1 · EQUIPO</text>
<rect x="50" y="128" width="215" height="185" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="157" y="152" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">DE-9 hembra</text>
<text x="157" y="169" font-size="11" text-anchor="middle" fill="#777">vista de frente</text>
<path d="M72 184 L243 184 L235 232 L80 232 Z" fill="#eef1f6" stroke="#333" stroke-width="1.5"/>
<g font-size="11" text-anchor="middle" fill="#333">
<circle cx="93" cy="198" r="6.5" fill="#fff" stroke="#888"/><text x="93" y="202">5</text>
<circle cx="124" cy="198" r="6.5" fill="#fff" stroke="#888"/><text x="124" y="202">4</text>
<circle cx="155" cy="198" r="6.5" fill="#fff" stroke="#888"/><text x="155" y="202">3</text>
<circle cx="186" cy="198" r="6.5" fill="#ffd94a" stroke="#333" stroke-width="1.5"/><text x="186" y="202">2</text>
<circle cx="217" cy="198" r="6.5" fill="#fff" stroke="#888"/><text x="217" y="202">1</text>
<circle cx="108" cy="219" r="6.5" fill="#f4a3a3" stroke="#333" stroke-width="1.5"/><text x="108" y="223">9</text>
<circle cx="139" cy="219" r="6.5" fill="#fff" stroke="#888"/><text x="139" y="223">8</text>
<circle cx="170" cy="219" r="6.5" fill="#8fd18f" stroke="#333" stroke-width="1.5"/><text x="170" y="223">7</text>
<circle cx="201" cy="219" r="6.5" fill="#bdbdbd" stroke="#333" stroke-width="1.5"/><text x="201" y="223">6</text>
</g>
<g font-size="11.5" fill="#222">
<text x="70" y="254">2 = CAN_L    ·    7 = CAN_H    ·    6 = GND</text>
<text x="70" y="274" fill="#b00" font-weight="bold">9 = V+   NO CONECTAR</text>
<text x="70" y="296" fill="#777">DB9 macho de bornera en medio</text>
</g>

<!-- MCP2515 -->
<text x="320" y="116" font-size="13" font-weight="bold" fill="#777">2 · MÓDULO MCP2515 + TJA1050</text>
<rect x="320" y="128" width="265" height="290" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="336" y="144" width="233" height="40" rx="4" fill="#ffecec" stroke="#c33"/>
<text x="452" y="162" font-size="13" font-weight="bold" text-anchor="middle" fill="#a00">ALIMENTAR A 5 V</text>
<text x="452" y="177" font-size="11" text-anchor="middle" fill="#a00">el TJA1050 no trabaja a 3.3 V</text>
<rect x="336" y="196" width="105" height="86" rx="4" fill="#eaf3ea" stroke="#666"/>
<text x="388" y="214" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">bornera</text>
<g font-size="12" fill="#222" text-anchor="middle">
<text x="388" y="238">CANH ← pin 7</text><text x="388" y="258">CANL ← pin 2</text><text x="388" y="276">GND  ← pin 6</text>
</g>
<rect x="455" y="196" width="114" height="140" rx="4" fill="#e9eef7" stroke="#666"/>
<text x="512" y="214" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">header SPI</text>
<g font-size="12" fill="#222">
<text x="470" y="236">VCC  5 V</text><text x="470" y="254">GND</text><text x="470" y="272">CS</text>
<text x="470" y="290">SO</text><text x="470" y="308">SI</text><text x="470" y="326">SCK · INT</text>
</g>
<rect x="336" y="348" width="233" height="56" rx="4" fill="#fff6e5" stroke="#e0a800"/>
<text x="452" y="367" font-size="12" font-weight="bold" text-anchor="middle" fill="#8a6100">Jumper J1 = terminación 120 Ω</text>
<text x="452" y="384" font-size="11.5" text-anchor="middle" fill="#8a6100">QUITARLO. Acá sí es jumper, no soldadura —</text>
<text x="452" y="398" font-size="11.5" text-anchor="middle" fill="#8a6100">es la ventaja de este módulo sobre el azul</text>

<!-- level shifter -->
<text x="640" y="116" font-size="13" font-weight="bold" fill="#777">3 · CONVERSOR DE NIVEL</text>
<rect x="640" y="128" width="200" height="290" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="740" y="152" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">TXS0108E</text>
<text x="740" y="169" font-size="11.5" text-anchor="middle" fill="#555">8 canales bidireccional</text>
<text x="740" y="185" font-size="11.5" text-anchor="middle" fill="#a00">hacen falta 5 — uno de 4 no alcanza</text>
<rect x="656" y="198" width="168" height="150" rx="4" fill="#f3eef7" stroke="#666"/>
<text x="672" y="220" font-size="12" font-weight="bold" fill="#333">HV = 5 V</text>
<text x="672" y="238" font-size="12" font-weight="bold" fill="#333">LV = 3.3 V</text>
<line x1="664" y1="248" x2="816" y2="248" stroke="#aaa" stroke-dasharray="3 3"/>
<g font-size="12" fill="#222">
<text x="672" y="268">CS    →</text><text x="672" y="286">SCK   →</text><text x="672" y="304">SI    →</text>
<text x="672" y="322">SO    ←</text><text x="672" y="340">INT   ←</text>
</g>
<text x="740" y="368" font-size="11.5" text-anchor="middle" fill="#666">GND común a todo</text>
<text x="740" y="386" font-size="11.5" text-anchor="middle" fill="#a06a00" font-weight="bold">SPI a 1 MHz, no más</text>
<text x="740" y="402" font-size="11" text-anchor="middle" fill="#888">el auto-direction se confunde rápido</text>

<!-- esp32 -->
<text x="895" y="116" font-size="13" font-weight="bold" fill="#777">4 · CÓMPUTO</text>
<rect x="895" y="128" width="185" height="290" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="987" y="152" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">ESP32</text>
<text x="987" y="169" font-size="11.5" text-anchor="middle" fill="#555">VSPI · no usa su TWAI</text>
<rect x="911" y="184" width="153" height="164" rx="4" fill="#f2eef7" stroke="#666"/>
<g font-size="12" fill="#222">
<text x="925" y="206">3V3      →  LV</text>
<text x="925" y="226">5V / VIN →  HV</text>
<text x="925" y="246">GND</text>
<text x="925" y="270">GPIO 5   CS</text>
<text x="925" y="288">GPIO 18  SCK</text>
<text x="925" y="306">GPIO 23  MOSI → SI</text>
<text x="925" y="324">GPIO 19  MISO ← SO</text>
<text x="925" y="342">GPIO 4   INT</text>
</g>
<text x="987" y="372" font-size="12" text-anchor="middle" fill="#111">USB de datos</text>
<text x="987" y="390" font-size="11" text-anchor="middle" fill="#888">corto · no de solo carga</text>
<rect x="1105" y="230" width="95" height="80" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="1152" y="266" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">compu</text>
<text x="1152" y="284" font-size="11" text-anchor="middle" fill="#888">o Jetson</text>

<!-- conexiones -->
<line x1="265" y1="215" x2="320" y2="230" stroke="#333" stroke-width="2"/>
<path d="M268 240 q14 -9 28 0 q14 9 28 0" fill="none" stroke="#ffb300" stroke-width="2.5"/>
<path d="M268 240 q14 9 28 0 q14 -9 28 0" fill="none" stroke="#2e9e2e" stroke-width="2.5"/>
<text x="293" y="290" font-size="10.5" text-anchor="middle" fill="#a06a00">trenzado</text>
<g stroke-width="2">
<line x1="585" y1="272" x2="640" y2="268" stroke="#37a"/>
<line x1="585" y1="290" x2="640" y2="286" stroke="#3a7"/>
<line x1="585" y1="308" x2="640" y2="304" stroke="#d33"/>
<line x1="585" y1="326" x2="640" y2="322" stroke="#333"/>
</g>
<g stroke-width="2">
<line x1="840" y1="268" x2="895" y2="270" stroke="#37a"/>
<line x1="840" y1="286" x2="895" y2="288" stroke="#3a7"/>
<line x1="840" y1="304" x2="895" y2="306" stroke="#d33"/>
<line x1="840" y1="322" x2="895" y2="324" stroke="#333"/>
</g>
<line x1="1080" y1="270" x2="1105" y2="270" stroke="#333" stroke-width="3"/>

<!-- crystal -->
<rect x="50" y="446" width="1150" height="92" rx="8" fill="#fdeaea" stroke="#c33" stroke-width="2"/>
<text x="70" y="474" font-size="15" font-weight="bold" fill="#a00">La trampa que cuesta una tarde: el cristal</text>
<g font-size="13" fill="#3a2020">
<text x="70" y="500">Mirá el cristal metálico del módulo con lupa. Dice <tspan font-weight="bold">8.000</tspan> o <tspan font-weight="bold">16.000</tspan>. La librería tiene que arrancar con <tspan font-family="monospace">MCP_8MHZ</tspan> o <tspan font-family="monospace">MCP_16MHZ</tspan> según corresponda.</text>
<text x="70" y="522">Si te equivocás, <tspan font-weight="bold">el bus queda mudo y todo lo demás parece correcto</tspan>. La mayoría de los módulos baratos son de 8 MHz. Anotá cuál te tocó.</text>
</g>

<!-- alternativas -->
<rect x="50" y="556" width="1150" height="150" rx="8" fill="#fff6e5" stroke="#e0a800" stroke-width="2"/>
<text x="70" y="584" font-size="15" font-weight="bold" fill="#8a6100">Tres formas de resolver los 5 V, de mejor a peor</text>
<g font-size="13" fill="#3a3020">
<text x="70" y="612">A ·  <tspan font-weight="bold">Cortar la pista de VCC del MCP2515</tspan> y alimentarlo a 3.3 V, dejando solo el TJA1050 a 5 V. Queda todo el lado lógico en 3.3 V y</text>
<text x="90" y="632">no hace falta conversor. <tspan font-weight="bold">Es la mejor</tspan>, pero hay que cortar con cúter y puentear. Irreversible en el módulo, no en el equipo.</text>
<text x="70" y="658">B ·  <tspan font-weight="bold">Conversor de nivel de 8 canales</tspan> — lo del diagrama. Sin modificar nada, cinco canales, SPI lento. <tspan font-weight="bold">Recomendada si no querés cortar.</tspan></text>
<text x="70" y="684">C ·  <tspan font-weight="bold">Divisores resistivos solo en SO e INT</tspan>, y CS/SCK/SI directos a 3.3 V. <tspan fill="#a00">Funciona seguido, no siempre:</tspan> el MCP2515 a 5 V pide 3.5 V</text>
<text x="90" y="702">para leer un ALTO, y vos le das 3.3. Queda al filo. Sirve para salir del paso, no para dejarlo instalado.</text>
</g>

<!-- reglas -->
<rect x="50" y="724" width="1150" height="86" rx="8" fill="#eef4ee" stroke="#4a7a4a" stroke-width="2"/>
<text x="70" y="752" font-size="15" font-weight="bold" fill="#2a5a2a">Lo que no cambia con este módulo</text>
<g font-size="13" fill="#203020">
<text x="70" y="778">·  <tspan font-weight="bold">Solo se escucha.</tspan>  El MCP2515 tiene Listen-Only en su hoja de datos, y las librerías lo exponen. Se activa antes de conectar al equipo.</text>
<text x="70" y="798">·  <tspan font-weight="bold">El pin 9 nunca se conecta.</tspan>   ·  Quitar J1.   ·  Medir CANH↔CANL antes de tocar el bus.   ·  Nada irreversible en el montacargas.</text>
</g>
</svg>
