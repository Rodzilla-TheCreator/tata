<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="Helvetica,Arial,sans-serif">
<rect width="1180" height="760" fill="#fbfbf8"/>
<text x="40" y="46" font-size="24" font-weight="bold" fill="#111">Cadena de escucha CAN — EDR18N2</text>
<text x="40" y="70" font-size="14" fill="#555">Del puerto de servicio DE-9 al ESP32. Solo escucha: TWAI_MODE_LISTEN_ONLY. 250 kbaud.</text>
<line x1="40" y1="84" x2="1140" y2="84" stroke="#ccc"/>

<!-- 1 conector del equipo -->
<text x="50" y="118" font-size="13" font-weight="bold" fill="#777">1 · EQUIPO</text>
<rect x="50" y="130" width="230" height="200" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="165" y="156" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">DE-9 hembra</text>
<text x="165" y="174" font-size="11" text-anchor="middle" fill="#777">tabla de fusibles · vista de frente</text>
<path d="M75 192 L255 192 L246 244 L84 244 Z" fill="#eef1f6" stroke="#333" stroke-width="1.5"/>
<g font-size="11" text-anchor="middle" fill="#333">
<circle cx="97" cy="207" r="6.5" fill="#fff" stroke="#888"/><text x="97" y="211">5</text>
<circle cx="130" cy="207" r="6.5" fill="#fff" stroke="#888"/><text x="130" y="211">4</text>
<circle cx="163" cy="207" r="6.5" fill="#fff" stroke="#888"/><text x="163" y="211">3</text>
<circle cx="196" cy="207" r="6.5" fill="#ffd94a" stroke="#333" stroke-width="1.5"/><text x="196" y="211">2</text>
<circle cx="229" cy="207" r="6.5" fill="#fff" stroke="#888"/><text x="229" y="211">1</text>
<circle cx="113" cy="230" r="6.5" fill="#f4a3a3" stroke="#333" stroke-width="1.5"/><text x="113" y="234">9</text>
<circle cx="146" cy="230" r="6.5" fill="#fff" stroke="#888"/><text x="146" y="234">8</text>
<circle cx="179" cy="230" r="6.5" fill="#8fd18f" stroke="#333" stroke-width="1.5"/><text x="179" y="234">7</text>
<circle cx="212" cy="230" r="6.5" fill="#bdbdbd" stroke="#333" stroke-width="1.5"/><text x="212" y="234">6</text>
</g>
<g font-size="12" fill="#222">
<rect x="72" y="258" width="12" height="12" fill="#ffd94a" stroke="#333"/><text x="92" y="269">pin 2 — CAN_L</text>
<rect x="72" y="276" width="12" height="12" fill="#8fd18f" stroke="#333"/><text x="92" y="287">pin 7 — CAN_H</text>
<rect x="72" y="294" width="12" height="12" fill="#bdbdbd" stroke="#333"/><text x="92" y="305">pin 6 — GND</text>
<rect x="72" y="312" width="12" height="12" fill="#f4a3a3" stroke="#333"/><text x="92" y="323" fill="#b00">pin 9 — V+  NO CONECTAR</text>
</g>

<!-- 2 DB9 tornillos -->
<text x="330" y="118" font-size="13" font-weight="bold" fill="#777">2 · ADAPTADOR</text>
<rect x="330" y="130" width="180" height="200" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="420" y="156" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">DB9 macho</text>
<text x="420" y="174" font-size="12" text-anchor="middle" fill="#555">con bornera de tornillo</text>
<text x="420" y="192" font-size="11" text-anchor="middle" fill="#888">C&amp;D · ~L120 · sin soldar</text>
<rect x="352" y="206" width="136" height="104" rx="4" fill="#eaf3ea" stroke="#666"/>
<g font-size="12" fill="#222">
<circle cx="372" cy="228" r="6" fill="#ffd94a" stroke="#333"/><text x="388" y="232">2 → CANL</text>
<circle cx="372" cy="254" r="6" fill="#8fd18f" stroke="#333"/><text x="388" y="258">7 → CANH</text>
<circle cx="372" cy="280" r="6" fill="#bdbdbd" stroke="#333"/><text x="388" y="284">6 → GND</text>
<circle cx="372" cy="300" r="6" fill="#fff" stroke="#c00" stroke-dasharray="2 2"/><text x="388" y="304" fill="#b00" font-size="11">9   vacío</text>
</g>

<!-- 3 transceptor -->
<text x="560" y="118" font-size="13" font-weight="bold" fill="#777">3 · TRANSCEPTOR</text>
<rect x="560" y="130" width="210" height="200" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="665" y="156" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">SN65HVD230</text>
<text x="665" y="174" font-size="12" text-anchor="middle" fill="#b00" font-weight="bold">3.3 V — nunca 5 V</text>
<rect x="582" y="188" width="166" height="124" rx="4" fill="#e9eef7" stroke="#666"/>
<g font-size="12" fill="#222">
<text x="598" y="208">CANL</text><text x="598" y="228">CANH</text><text x="598" y="248">GND</text>
<text x="598" y="272">3V3</text><text x="598" y="290">CTX</text><text x="598" y="308">CRX</text>
</g>
<text x="712" y="208" font-size="11" fill="#888">bus</text>
<text x="712" y="290" font-size="11" fill="#888">lógica</text>
<line x1="590" y1="258" x2="742" y2="258" stroke="#aaa" stroke-dasharray="3 3"/>

<!-- 4 esp32 -->
<text x="820" y="118" font-size="13" font-weight="bold" fill="#777">4 · CÓMPUTO</text>
<rect x="820" y="130" width="180" height="200" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="910" y="156" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">ESP32</text>
<text x="910" y="174" font-size="12" text-anchor="middle" fill="#555">controlador TWAI</text>
<rect x="842" y="190" width="136" height="90" rx="4" fill="#f2eef7" stroke="#666"/>
<g font-size="12" fill="#222">
<text x="856" y="210">3V3</text><text x="856" y="230">GND</text>
<text x="856" y="250">GPIO  (TX)</text><text x="856" y="270">GPIO  (RX)</text>
</g>
<text x="910" y="302" font-size="12" text-anchor="middle" fill="#111">USB de datos</text>
<text x="910" y="318" font-size="11" text-anchor="middle" fill="#888">corto · no de solo carga</text>

<!-- 5 compu -->
<rect x="1040" y="190" width="100" height="90" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="1090" y="228" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">compu</text>
<text x="1090" y="248" font-size="11" text-anchor="middle" fill="#888">o Jetson</text>

<!-- conexiones equipo -> db9 -->
<line x1="280" y1="215" x2="330" y2="215" stroke="#333" stroke-width="2"/>
<text x="305" y="205" font-size="11" text-anchor="middle" fill="#666">calza</text>

<!-- db9 -> transceptor : par trenzado -->
<path d="M510 228 q14 -10 28 0 q14 10 28 0" fill="none" stroke="#ffb300" stroke-width="2.5"/>
<path d="M510 228 q14 10 28 0 q14 -10 28 0" fill="none" stroke="#2e9e2e" stroke-width="2.5"/>
<line x1="510" y1="282" x2="566" y2="248" stroke="#999" stroke-width="2.5"/>
<text x="538" y="196" font-size="11" text-anchor="middle" fill="#a06a00" font-weight="bold">par trenzado</text>
<text x="538" y="330" font-size="11" text-anchor="middle" fill="#666">3 hilos de cable ethernet · &lt; 30 cm</text>

<!-- transceptor -> esp32 : jumpers -->
<g stroke-width="2">
<line x1="770" y1="272" x2="820" y2="204" stroke="#d33"/>
<line x1="770" y1="278" x2="820" y2="226" stroke="#333"/>
<line x1="770" y1="288" x2="820" y2="246" stroke="#3a7"/>
<line x1="770" y1="300" x2="820" y2="266" stroke="#37a"/>
</g>
<text x="795" y="326" font-size="11" text-anchor="middle" fill="#666">4 jumpers H-H</text>

<!-- esp32 -> compu -->
<line x1="1000" y1="235" x2="1040" y2="235" stroke="#333" stroke-width="3"/>

<!-- avisos -->
<rect x="50" y="380" width="1090" height="150" rx="8" fill="#fff6e5" stroke="#e0a800" stroke-width="2"/>
<text x="70" y="410" font-size="15" font-weight="bold" fill="#8a6100">Antes de tocar el equipo — tres verificaciones, con óhmetro</text>
<g font-size="13" fill="#3a3020">
<text x="70" y="440">1 ·  <tspan font-weight="bold">Terminación del módulo.</tspan>  Medir CANH ↔ CANL del SN65HVD230, desconectado de todo. Si marca ~120 Ω, el R2 está puesto:</text>
<text x="90" y="460">levantarle una pata o desoldarlo. El bus del equipo ya está terminado en sus extremos; un tercero baja la impedancia y mete errores.</text>
<text x="70" y="486">2 ·  <tspan font-weight="bold">Continuidad del DB9.</tspan>  Pin 2 → CANL, pin 7 → CANH, pin 6 → GND. Y confirmar que <tspan fill="#b00" font-weight="bold">el pin 9 no tiene nada</tspan>.</text>
<text x="70" y="512">3 ·  <tspan font-weight="bold">Self-test del TWAI.</tspan>  El ESP32 se manda tramas a sí mismo por el transceptor. Control de falsación: sin transceptor, sin eco.</text>
</g>

<rect x="50" y="550" width="1090" height="86" rx="8" fill="#fdeaea" stroke="#c33" stroke-width="2"/>
<text x="70" y="580" font-size="15" font-weight="bold" fill="#a00">Reglas que no se negocian</text>
<g font-size="13" fill="#3a2020">
<text x="70" y="606">·  <tspan font-weight="bold">Solo se escucha.</tspan>  TWAI_MODE_LISTEN_ONLY: no manda ni los bits de reconocimiento.   ·  <tspan font-weight="bold">El pin 9 nunca se conecta</tspan> — es alimentación del equipo.</text>
<text x="70" y="626">·  El SN65HVD230 se alimenta del <tspan font-weight="bold">3V3 del ESP32</tspan>, jamás del 5 V.   ·  No se corta ningún cable del montacargas. Nada irreversible.</text>
</g>

<text x="50" y="672" font-size="12" fill="#888">Bus del EDR18N2: CANopen 250 kbaud (manual de servicio, tabla de sistemas de bus). PC de servicio = nodo 30. Ver docs/16.</text>
<text x="50" y="692" font-size="12" fill="#888">El WiFi queda fuera del lazo: su jitter no cabe en el presupuesto de 200 ms del watchdog. Ver docs/10.</text>
<text x="50" y="712" font-size="12" fill="#888">A bordo, con la Jetson: hace falta transceptor aislado (ISO1050) para no compartir tierra con el bus de 24–48 V.</text>
</svg>
