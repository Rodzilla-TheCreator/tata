<text x="978" y="770" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">BANCO, sin ESP: IN a 5 V con un cable</text>
<rect x="20" y="708" width="770" height="236" rx="10" fill="#fafafa" stroke="#ddd"/>
<text x="34" y="730" font-size="15" text-anchor="start" font-weight="bold" fill="#111">Qué ve el equipo</text>
<text x="34" y="756" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111"></text>
<text x="370" y="756" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111">pin 2 (blanco)</text>
<text x="505" y="756" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111">pin 4 (negro)</text>
<text x="640" y="756" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111">estado</text>
<text x="34" y="778" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111">relés SIN activar (IN bajo, paro o ESP muerto)</text>
<text x="370" y="778" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111">− (bajo)</text>
<text x="505" y="778" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111">+ por J2 (alto)</text>
<text x="640" y="778" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111">tiene que ser «suelto»</text>
<text x="34" y="800" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111">relés activados (IN alto)</text>
<text x="370" y="800" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111">+ por J1 (alto)</text>
<text x="505" y="800" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111">− (bajo)</text>
<text x="640" y="800" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111">«pisado»</text>
<text x="34" y="832" font-size="12.2" text-anchor="start" font-weight="normal" fill="#333">• Siempre una salida alta y la otra baja: nunca 0/0 ni 1/1 (evento 1.06). El + nunca toca el −: cada salida va al COM.</text>
<text x="34" y="853" font-size="12.2" text-anchor="start" font-weight="normal" fill="#333">• Si en el equipo «sin activar» resulta «pisado», se cruzan 2 y 4 en la bornera: sin activar SIEMPRE = suelto.</text>
<text x="34" y="874" font-size="12.2" text-anchor="start" font-weight="normal" fill="#333">• Módulo activo en bajo o sin jumper H/L: NO sirve (ESP muerto = pisado). Control: IN al aire → relé suelto.</text>
<text x="34" y="895" font-size="12.2" text-anchor="start" font-weight="normal" fill="#333">• Banco: fuente 12 V, + al pin 1 y − al pin 3; multímetro en 2 y 4 contra 3. 47 kΩ con 10 kΩ de carga ≈ 2.1 V.</text>
<text x="34" y="916" font-size="12.2" text-anchor="start" font-weight="normal" fill="#333">• Equipo: los Dupont no van al XS160. Primero medir pines 1, 2, 4 contra 3 (llave ON, sensor desconectado).</text>
<text x="1160" y="946" font-size="11" text-anchor="end" fill="#999">TaTa · Montasa</text>
</svg>