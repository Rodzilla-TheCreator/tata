<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Helvetica,Arial,sans-serif">
  <style>
    .box{fill:#f6f8fa;stroke:#333;stroke-width:1.5}
    .chip{fill:#eef3fb;stroke:#2a4b7c;stroke-width:1.5}
    .tb{font-size:14px;font-weight:bold;fill:#111}
    .sm{font-size:11px;fill:#444}
    .pwr{stroke:#d81e2c;stroke-width:2.6;fill:none}
    .gnd{stroke:#222;stroke-width:2.6;fill:none}
    .verde{stroke:#1a9e1a;stroke-width:2.6;fill:none}
    .cafe{stroke:#8a5a2b;stroke-width:2.6;fill:none}
    .sig{stroke:#1763d6;stroke-width:2;fill:none}
    .blanco{stroke:#9aa0a6;stroke-width:2.6;fill:none}
    .amar{stroke:#c9a200;stroke-width:2.6;fill:none}
    .dot{fill:#222}
  </style>

  <text x="28" y="28" class="tb" font-size="18">Emulador del sensor del volante — conexionado (sin relé, directo a node 4)</text>
  <text x="28" y="47" class="sm">verde = 2.47 + 1.98·cos θ   ·   café = 2.47 + 1.98·sin θ   (seno/coseno, círculo, absoluto).  node 4 deriva la velocidad del cambio de θ.</text>

  <!-- Rails -->
  <line x1="55" y1="80" x2="950" y2="80" class="pwr"/>
  <text x="57" y="74" class="tb" fill="#d81e2c">+5 V  (power bank USB)</text>
  <line x1="55" y1="545" x2="950" y2="545" class="gnd"/>
  <text x="57" y="565" class="tb">GND común  =  amarillo del conector (único hilo que toca el equipo)</text>

  <!-- POWER BANK -->
  <rect x="55" y="250" width="95" height="90" rx="6" class="box"/>
  <text x="102" y="288" class="sm" text-anchor="middle">POWER</text>
  <text x="102" y="303" class="sm" text-anchor="middle">BANK</text>
  <text x="102" y="318" class="sm" text-anchor="middle">USB 5 V</text>
  <line x1="102" y1="250" x2="102" y2="80" class="pwr"/>
  <line x1="102" y1="340" x2="102" y2="545" class="gnd"/>
  <circle cx="102" cy="80" r="3.5" class="dot"/>
  <circle cx="102" cy="545" r="3.5" class="dot"/>

  <!-- POT -->
  <rect x="220" y="100" width="185" height="44" rx="6" class="box"/>
  <text x="312" y="127" class="sm" text-anchor="middle">POTE 10 k — velocidad de giro</text>
  <line x1="248" y1="144" x2="248" y2="165" class="pwr"/>
  <text x="248" y="179" class="sm" text-anchor="middle">3V3</text>
  <line x1="378" y1="144" x2="378" y2="165" class="gnd"/>
  <text x="378" y="179" class="sm" text-anchor="middle">GND</text>
  <path d="M312,144 L312,160 L430,160 L430,250 L452,250" class="sig"/>

  <!-- ESP32 -->
  <rect x="225" y="195" width="180" height="280" rx="4" class="chip"/>
  <text x="315" y="220" class="tb" text-anchor="middle" fill="#2a4b7c">ESP32</text>
  <!-- power -->
  <line x1="265" y1="195" x2="265" y2="80" class="pwr"/>
  <text x="271" y="190" class="sm">5V</text>
  <circle cx="265" cy="80" r="3.5" class="dot"/>
  <line x1="295" y1="475" x2="295" y2="545" class="gnd"/>
  <text x="301" y="492" class="sm">GND</text>
  <circle cx="295" cy="545" r="3.5" class="dot"/>
  <path d="M225,250 L200,250 L200,165 L248,165" class="pwr"/>
  <text x="182" y="246" class="sm">3V3</text>
  <!-- signal pins -->
  <text x="399" y="254" class="sm" text-anchor="end">GPIO34 ← pote</text>
  <line x1="405" y1="250" x2="452" y2="250" class="sig"/>
  <text x="399" y="324" class="sm" text-anchor="end">GPIO25 · DAC verde</text>
  <line x1="405" y1="330" x2="480" y2="330" class="verde"/>
  <text x="399" y="394" class="sm" text-anchor="end">GPIO26 · DAC café</text>
  <line x1="405" y1="400" x2="480" y2="400" class="cafe"/>

  <!-- OP-AMP -->
  <rect x="480" y="265" width="225" height="165" rx="6" class="box"/>
  <text x="592" y="287" class="tb" text-anchor="middle">MCP6002 (RRIO)</text>
  <text x="592" y="305" class="sm" text-anchor="middle">Vcc = +5 V  → clamp: salida ≤ 5 V</text>
  <text x="592" y="321" class="sm" text-anchor="middle">G = 1 + Rf/Rg = 1.36</text>
  <text x="592" y="337" class="sm" text-anchor="middle">Rg = 10k · Rf = 3.6k (trimpot 5k)</text>
  <text x="492" y="360" class="sm">U1a (verde) no-inv.</text>
  <text x="492" y="420" class="sm">U1b (café) no-inv.</text>
  <line x1="592" y1="265" x2="592" y2="80" class="pwr"/>
  <circle cx="592" cy="80" r="3.5" class="dot"/>
  <line x1="635" y1="430" x2="635" y2="545" class="gnd"/>
  <circle cx="635" cy="545" r="3.5" class="dot"/>
  <!-- outputs direct to connector -->
  <path d="M705,340 L770,340" class="verde"/>
  <text x="712" y="334" class="sm">verde out</text>
  <path d="M705,405 L740,405 L740,390 L770,390" class="cafe"/>
  <text x="712" y="420" class="sm">café out</text>

  <!-- CONNECTOR to node 4 -->
  <rect x="770" y="265" width="135" height="175" rx="6" class="box"/>
  <text x="837" y="289" class="tb" text-anchor="middle">CONECTOR</text>
  <text x="837" y="307" class="tb" text-anchor="middle">→ node 4</text>
  <circle cx="770" cy="340" r="3" class="dot"/>
  <text x="778" y="336" class="sm">verde (señal)</text>
  <circle cx="770" cy="390" r="3" class="dot"/>
  <text x="778" y="386" class="sm">café (señal)</text>
  <text x="778" y="414" class="sm">amarillo → GND</text>
  <line x1="860" y1="440" x2="860" y2="545" class="amar"/>
  <circle cx="860" cy="545" r="3.5" class="dot"/>
  <text x="778" y="432" class="sm" fill="#999">blanco +11 V (sin usar)</text>

  <!-- LEGEND -->
  <rect x="55" y="380" width="300" height="150" fill="#fff" stroke="#bbb"/>
  <text x="67" y="400" class="tb">Referencias</text>
  <line x1="67" y1="416" x2="99" y2="416" class="pwr"/><text x="107" y="420" class="sm">+5 V (power bank)</text>
  <line x1="67" y1="436" x2="99" y2="436" class="gnd"/><text x="107" y="440" class="sm">GND común (amarillo)</text>
  <line x1="67" y1="456" x2="99" y2="456" class="verde"/><text x="107" y="460" class="sm">señal VERDE (cos)</text>
  <line x1="67" y1="476" x2="99" y2="476" class="cafe"/><text x="107" y="480" class="sm">señal CAFÉ (sin)</text>
  <line x1="67" y1="496" x2="99" y2="496" class="sig"/><text x="107" y="500" class="sm">lógica ESP (DAC, pote)</text>
  <text x="67" y="520" class="sm">Sensor real DESCONECTADO; emulador directo a node 4.</text>

  <!-- NOTES -->
  <rect x="375" y="470" width="575" height="62" fill="#fffbe6" stroke="#d9c76a"/>
  <text x="387" y="489" class="sm">SIN RELÉ: sin handoff automático. OK en EDR parado de desarrollo (no hay operador). Si el ESP se cuelga, node 4 lee señal</text>
  <text x="387" y="504" class="sm">inválida → falla y deshabilita la dirección (seguro en parado). Op-amp a 5 V = la salida no puede pasar de 5 V (protege node 4).</text>
  <text x="387" y="519" class="sm">VALIDAR primero: salida op-amp → caracterizador (A0/A1). Mismo círculo (radio ≈ 1.95, nrad ≈ 1) antes de tocar node 4.</text>
</svg>
