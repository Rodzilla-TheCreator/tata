<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" font-family="Helvetica,Arial,sans-serif">
  <style>
    .box{fill:#f6f8fa;stroke:#333;stroke-width:1.5;rx:6}
    .chip{fill:#eef3fb;stroke:#2a4b7c;stroke-width:1.5}
    .t{font-size:13px;fill:#111}
    .tb{font-size:14px;font-weight:bold;fill:#111}
    .sm{font-size:11px;fill:#444}
    .pwr{stroke:#d81e2c;stroke-width:2.6;fill:none}
    .gnd{stroke:#222;stroke-width:2.6;fill:none}
    .verde{stroke:#1a9e1a;stroke-width:2.6;fill:none}
    .cafe{stroke:#8a5a2b;stroke-width:2.6;fill:none}
    .sig{stroke:#1763d6;stroke-width:2;fill:none}
    .blanco{stroke:#9aa0a6;stroke-width:2.6;fill:none}
    .amar{stroke:#c9a200;stroke-width:2.6;fill:none}
    .dot{fill:#222}
  </style>

  <text x="30" y="30" class="tb" font-size="18">Emulador del sensor del volante — conexionado</text>
  <text x="30" y="50" class="sm">verde = 2.47 + 1.98·cos θ   ·   café = 2.47 + 1.98·sin θ   (seno/coseno, círculo, absoluto).  node 4 deriva la velocidad del cambio de θ.</text>

  <!-- Rails -->
  <line x1="60" y1="80" x2="1100" y2="80" class="pwr"/>
  <text x="62" y="74" class="tb" fill="#d81e2c">+5 V  (power bank USB)</text>
  <line x1="60" y1="770" x2="1100" y2="770" class="gnd"/>
  <text x="62" y="790" class="tb">GND común  =  amarillo del sensor (único punto que toca el equipo)</text>

  <!-- POWER BANK -->
  <rect x="60" y="360" width="100" height="90" class="box"/>
  <text x="110" y="398" class="t" text-anchor="middle">POWER</text>
  <text x="110" y="414" class="t" text-anchor="middle">BANK</text>
  <text x="110" y="430" class="t" text-anchor="middle">USB 5 V</text>
  <line x1="110" y1="360" x2="110" y2="80" class="pwr"/>
  <line x1="110" y1="450" x2="110" y2="770" class="gnd"/>
  <circle cx="110" cy="80" r="3.5" class="dot"/>
  <circle cx="110" cy="770" r="3.5" class="dot"/>

  <!-- POT -->
  <rect x="235" y="110" width="185" height="46" class="box"/>
  <text x="327" y="138" class="t" text-anchor="middle">POTE 10 k — velocidad de giro</text>
  <!-- pot leads -->
  <line x1="260" y1="156" x2="260" y2="178" class="pwr"/>
  <text x="258" y="192" class="sm" text-anchor="middle">3V3</text>
  <line x1="397" y1="156" x2="397" y2="178" class="gnd"/>
  <text x="397" y="192" class="sm" text-anchor="middle">GND</text>
  <!-- wiper to GPIO34 -->
  <path d="M327,156 L327,176 L447,176 L447,250 L470,250" class="sig"/>

  <!-- ESP32 -->
  <rect x="240" y="220" width="180" height="360" class="chip"/>
  <text x="330" y="245" class="tb" text-anchor="middle" fill="#2a4b7c">ESP32</text>
  <!-- power pins -->
  <line x1="280" y1="220" x2="280" y2="80" class="pwr"/>
  <text x="286" y="214" class="sm">5V</text>
  <circle cx="280" cy="80" r="3.5" class="dot"/>
  <line x1="300" y1="580" x2="300" y2="770" class="gnd"/>
  <text x="306" y="596" class="sm">GND</text>
  <circle cx="300" cy="770" r="3.5" class="dot"/>
  <!-- 3V3 out to pot -->
  <path d="M240,250 L215,250 L215,178 L260,178" class="pwr"/>
  <text x="196" y="246" class="sm">3V3</text>
  <!-- signal pins (right edge) -->
  <text x="414" y="254" class="sm" text-anchor="end">GPIO34 ← pote</text>
  <line x1="420" y1="250" x2="470" y2="250" class="sig"/>
  <text x="414" y="334" class="sm" text-anchor="end">GPIO25 · DAC verde</text>
  <line x1="420" y1="340" x2="500" y2="340" class="verde"/>
  <text x="414" y="414" class="sm" text-anchor="end">GPIO26 · DAC café</text>
  <line x1="420" y1="420" x2="500" y2="420" class="cafe"/>
  <text x="414" y="494" class="sm" text-anchor="end">GPIO27 → relé</text>
  <path d="M420,490 L450,490 L450,690 L690,690" class="sig"/>

  <!-- OP-AMP STAGE -->
  <rect x="500" y="280" width="210" height="190" class="box"/>
  <text x="605" y="302" class="tb" text-anchor="middle">MCP6002 (RRIO)</text>
  <text x="605" y="320" class="sm" text-anchor="middle">Vcc = +5 V  → clamp: salida ≤ 5 V</text>
  <text x="605" y="336" class="sm" text-anchor="middle">G = 1 + Rf/Rg = 1.36</text>
  <text x="605" y="352" class="sm" text-anchor="middle">Rg = 10k · Rf = 3.6k (trimpot 5k)</text>
  <text x="520" y="372" class="sm">U1a (verde) no-inv.</text>
  <text x="520" y="452" class="sm">U1b (café) no-inv.</text>
  <!-- opamp Vcc / Vee -->
  <line x1="605" y1="280" x2="605" y2="80" class="pwr"/>
  <circle cx="605" cy="80" r="3.5" class="dot"/>
  <line x1="650" y1="470" x2="650" y2="770" class="gnd"/>
  <circle cx="650" cy="770" r="3.5" class="dot"/>
  <!-- outputs -->
  <path d="M710,375 L740,375 L740,320 L690,320" class="verde"/>
  <text x="712" y="372" class="sm">verde out</text>
  <path d="M710,450 L760,450 L760,430 L690,430" class="cafe"/>
  <text x="712" y="447" class="sm">café out</text>

  <!-- RELAY -->
  <rect x="690" y="290" width="180" height="180" class="box"/>
  <text x="780" y="312" class="tb" text-anchor="middle">RELÉ DPDT (señal)</text>
  <text x="780" y="330" class="sm" text-anchor="middle">contactos de oro</text>
  <text x="780" y="458" class="sm" text-anchor="middle">desenergizado = sensor REAL</text>
  <!-- pole verde -->
  <text x="700" y="356" class="sm">NO</text>
  <text x="700" y="378" class="sm">NC</text>
  <circle cx="694" cy="320" r="3" class="dot"/><!-- NO verde in -->
  <circle cx="694" cy="372" r="3" class="dot"/><!-- NC verde in -->
  <path d="M870,338 L905,338" class="verde"/>
  <text x="846" y="334" class="sm">COM</text>
  <!-- pole cafe -->
  <circle cx="694" cy="430" r="3" class="dot"/><!-- NO cafe in -->
  <circle cx="694" cy="405" r="3" class="dot"/><!-- NC cafe in -->
  <path d="M870,418 L905,418" class="cafe"/>
  <text x="846" y="414" class="sm">COM</text>
  <!-- sensor real NC feeds -->
  <path d="M700,372 L678,372 L678,615 L735,615" class="verde"/>
  <path d="M700,405 L665,405 L665,650 L735,650" class="cafe"/>
  <!-- coil driver -->
  <rect x="700" y="500" width="150" height="70" class="box"/>
  <text x="775" y="520" class="sm" text-anchor="middle">bobina 5 V + driver:</text>
  <text x="775" y="536" class="sm" text-anchor="middle">GPIO27 →[1k]→ B·2N2222</text>
  <text x="775" y="552" class="sm" text-anchor="middle">bobina: +5V→colector</text>
  <text x="775" y="566" class="sm" text-anchor="middle">1N4148 flyback · E→GND</text>
  <line x1="840" y1="500" x2="840" y2="80" class="pwr"/>
  <circle cx="840" cy="80" r="3.5" class="dot"/>
  <line x1="720" y1="570" x2="720" y2="770" class="gnd"/>
  <circle cx="720" cy="770" r="3.5" class="dot"/>

  <!-- SENSOR REAL -->
  <rect x="690" y="600" width="210" height="100" class="box"/>
  <text x="795" y="624" class="tb" text-anchor="middle">SENSOR REAL</text>
  <text x="795" y="642" class="sm" text-anchor="middle">(queda puesto en el equipo)</text>
  <text x="735" y="615" class="sm">verde→NC</text>
  <text x="735" y="650" class="sm">café→NC</text>
  <text x="795" y="672" class="sm" text-anchor="middle">blanco ← +11 V (equipo)</text>
  <text x="795" y="688" class="sm" text-anchor="middle">amarillo → GND</text>
  <line x1="820" y1="700" x2="820" y2="770" class="amar"/>
  <circle cx="820" cy="770" r="3.5" class="dot"/>

  <!-- CONNECTOR to node 4 -->
  <rect x="990" y="300" width="130" height="220" class="box"/>
  <text x="1055" y="324" class="tb" text-anchor="middle">CONECTOR</text>
  <text x="1055" y="342" class="tb" text-anchor="middle">→ node 4</text>
  <!-- verde / cafe from relay COM -->
  <path d="M905,338 L990,338" class="verde"/>
  <text x="995" y="356" class="sm">verde (señal)</text>
  <path d="M905,418 L990,418" class="cafe"/>
  <text x="995" y="436" class="sm">café (señal)</text>
  <!-- blanco: +11V from equipo, passes to real sensor -->
  <path d="M990,380 L955,380 L955,615 L900,615" class="blanco"/>
  <text x="995" y="384" class="sm">blanco +11 V</text>
  <!-- amarillo = GND -->
  <line x1="1055" y1="520" x2="1055" y2="770" class="amar"/>
  <text x="995" y="476" class="sm">amarillo (GND)</text>
  <circle cx="1055" cy="770" r="3.5" class="dot"/>

  <!-- LEGEND -->
  <rect x="60" y="560" width="300" height="170" fill="#fff" stroke="#bbb"/>
  <text x="72" y="582" class="tb">Referencias</text>
  <line x1="72" y1="600" x2="104" y2="600" class="pwr"/><text x="112" y="604" class="sm">+5 V (power bank)</text>
  <line x1="72" y1="620" x2="104" y2="620" class="gnd"/><text x="112" y="624" class="sm">GND común (amarillo)</text>
  <line x1="72" y1="640" x2="104" y2="640" class="verde"/><text x="112" y="644" class="sm">señal VERDE (cos)</text>
  <line x1="72" y1="660" x2="104" y2="660" class="cafe"/><text x="112" y="664" class="sm">señal CAFÉ (sin)</text>
  <line x1="72" y1="680" x2="104" y2="680" class="sig"/><text x="112" y="684" class="sm">lógica ESP (DAC, control)</text>
  <line x1="72" y1="700" x2="104" y2="700" class="blanco"/><text x="112" y="704" class="sm">+11 V del equipo (al sensor real)</text>
  <text x="72" y="722" class="sm">El relé solo conmuta las 2 señales a node 4.</text>

  <!-- NOTES -->
  <rect x="380" y="710" width="740" height="52" fill="#fffbe6" stroke="#d9c76a"/>
  <text x="392" y="728" class="sm">SEGURIDAD: op-amp a 5 V = la salida no puede pasar de 5 V (protege node 4). Relé desenergizado = sensor real (fail-safe); energizar SOLO en teleop.</text>
  <text x="392" y="744" class="sm">VALIDAR primero: salida op-amp → caracterizador (A0/A1). Mismo círculo (radio ≈ 1.95, nrad ≈ 1) = emulador idéntico. Recién ahí, por el relé, a node 4.</text>
  <text x="392" y="758" class="sm">Power bank 5 V (flota, sin ground loop). NO alimentar del riel de 11 V del sensor ni de la batería. El único hilo al equipo es la tierra (amarillo).</text>
</svg>
