<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 720" font-family="Helvetica,Arial,sans-serif">
  <style>
    .box{fill:#f6f8fa;stroke:#333;stroke-width:1.5}
    .chip{fill:#eef3fb;stroke:#2a4b7c;stroke-width:1.5}
    .blk{fill:#eef7ee;stroke:#2f7d32;stroke-width:1.5}
    .blkc{fill:#f6efe7;stroke:#8a5a2b;stroke-width:1.5}
    .res{fill:#fff;stroke:#333;stroke-width:1.2}
    .tb{font-size:14px;font-weight:bold;fill:#111}
    .sm{font-size:11px;fill:#333}
    .xs{font-size:10px;fill:#555}
    .pwr{stroke:#d81e2c;stroke-width:2.4;fill:none}
    .v11{stroke:#e8820c;stroke-width:2.4;fill:none}
    .gnd{stroke:#222;stroke-width:2.4;fill:none}
    .verde{stroke:#1a9e1a;stroke-width:2.4;fill:none}
    .cafe{stroke:#8a5a2b;stroke-width:2.4;fill:none}
    .sig{stroke:#1763d6;stroke-width:1.8;fill:none}
    .amar{stroke:#c9a200;stroke-width:2.4;fill:none}
    .dot{fill:#222}
  </style>

  <text x="24" y="26" class="tb" font-size="18">Emulador del timón — LM358, controlado por el ESP (sin pote, sin relé)</text>
  <text x="24" y="45" class="sm">verde = 2.47 + 1.98·cos θ   ·   café = 2.47 + 1.98·sin θ   ·   G = 1+Rf/Rg = 1.36 (DAC 0-3.3 V → 0-4.5 V)</text>

  <!-- rails -->
  <line x1="80" y1="70" x2="360" y2="70" class="pwr"/>
  <text x="82" y="64" class="tb" fill="#d81e2c">+5 V (power bank → ESP)</text>
  <line x1="50" y1="398" x2="985" y2="398" class="gnd"/>
  <text x="52" y="416" class="tb">GND común = amarillo del conector (único hilo de masa al equipo)</text>

  <!-- power bank -->
  <rect x="45" y="300" width="80" height="72" rx="6" class="box"/>
  <text x="85" y="333" class="sm" text-anchor="middle">POWER</text>
  <text x="85" y="348" class="sm" text-anchor="middle">BANK 5V</text>
  <line x1="85" y1="300" x2="85" y2="70" class="pwr"/>
  <line x1="85" y1="372" x2="85" y2="398" class="gnd"/>
  <circle cx="85" cy="70" r="3.2" class="dot"/><circle cx="85" cy="398" r="3.2" class="dot"/>

  <!-- ESP32 -->
  <rect x="155" y="150" width="165" height="235" rx="4" class="chip"/>
  <text x="237" y="174" class="tb" text-anchor="middle" fill="#2a4b7c">ESP32</text>
  <text x="237" y="300" class="xs" text-anchor="middle">θ comandado por software</text>
  <text x="237" y="314" class="xs" text-anchor="middle">/ teleop (USB serial)</text>
  <text x="237" y="328" class="xs" text-anchor="middle">→ no hay pote</text>
  <line x1="195" y1="150" x2="195" y2="70" class="pwr"/><text x="201" y="166" class="xs">5V</text>
  <circle cx="195" cy="70" r="3.2" class="dot"/>
  <line x1="195" y1="385" x2="195" y2="398" class="gnd"/><text x="201" y="380" class="xs">GND</text>
  <text x="314" y="234" class="xs" text-anchor="end">GPIO25 verde</text>
  <line x1="320" y1="238" x2="400" y2="238" class="verde"/>
  <text x="314" y="329" class="xs" text-anchor="end">GPIO26 café</text>
  <line x1="320" y1="333" x2="400" y2="333" class="cafe"/>

  <!-- Etapa VERDE block -->
  <rect x="400" y="208" width="215" height="60" rx="6" class="blk"/>
  <text x="507" y="232" class="sm" text-anchor="middle" font-weight="bold">Etapa VERDE — LM358 U1a</text>
  <text x="507" y="250" class="xs" text-anchor="middle">G=1.36 · + R150 + zener 5.1V</text>
  <line x1="615" y1="238" x2="700" y2="238" class="verde"/>

  <!-- Etapa CAFE block -->
  <rect x="400" y="303" width="215" height="60" rx="6" class="blkc"/>
  <text x="507" y="327" class="sm" text-anchor="middle" font-weight="bold">Etapa CAFÉ — LM358 U1b</text>
  <text x="507" y="345" class="xs" text-anchor="middle">pines 5/6/7 · idéntica</text>
  <line x1="615" y1="333" x2="700" y2="333" class="cafe"/>

  <!-- +11V bus to both blocks -->
  <path d="M700,268 L690,268 L690,186 L392,186 L392,303" class="v11"/>
  <line x1="430" y1="186" x2="430" y2="208" class="v11"/>
  <circle cx="430" cy="186" r="3" class="dot"/>
  <text x="434" y="182" class="sm" fill="#e8820c">+11 V (blanco) → LM358 Vcc (pin 8).  V− (pin 4) = GND</text>

  <!-- connector -->
  <rect x="700" y="205" width="130" height="185" rx="6" class="box"/>
  <text x="765" y="229" class="tb" text-anchor="middle">CONECTOR</text>
  <text x="765" y="246" class="tb" text-anchor="middle">→ node 4</text>
  <circle cx="700" cy="238" r="3" class="dot"/><text x="708" y="234" class="xs">verde (señal)</text>
  <circle cx="700" cy="268" r="3" class="dot"/><text x="708" y="278" class="xs" fill="#999">blanco +11 V</text>
  <circle cx="700" cy="333" r="3" class="dot"/><text x="708" y="329" class="xs">café (señal)</text>
  <circle cx="700" cy="360" r="3" class="dot"/><text x="708" y="364" class="xs">amarillo → GND</text>
  <line x1="765" y1="390" x2="765" y2="398" class="amar"/>
  <circle cx="765" cy="398" r="3.2" class="dot"/>

  <!-- ============ DETALLE DE UNA ETAPA ============ -->
  <rect x="45" y="436" width="470" height="200" rx="6" fill="#fff" stroke="#999"/>
  <text x="57" y="456" class="tb">Detalle de UNA etapa  (idéntica ×2: verde y café)</text>

  <!-- opamp triangle -->
  <path d="M190,500 L190,560 L250,530 Z" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="206" y="534" class="xs">U1</text>
  <text x="181" y="512" class="sm">+</text>
  <text x="181" y="554" class="sm">−</text>
  <!-- DAC into + -->
  <line x1="95" y1="507" x2="190" y2="507" class="sig"/>
  <text x="70" y="503" class="xs">DAC</text>
  <circle cx="190" cy="507" r="2.3" class="dot"/>
  <!-- - node -->
  <line x1="190" y1="553" x2="160" y2="553" class="sig"/>
  <circle cx="160" cy="553" r="2.3" class="dot"/>
  <!-- Rg to gnd -->
  <rect x="153" y="570" width="14" height="30" class="res"/><text x="172" y="589" class="xs">Rg 10k</text>
  <line x1="160" y1="553" x2="160" y2="570" class="sig"/>
  <line x1="160" y1="600" x2="160" y2="618" class="gnd"/>
  <!-- Rf feedback (arriba) -->
  <path d="M160,553 L160,478 L320,478" class="sig"/>
  <rect x="205" y="472" width="60" height="12" class="res"/><text x="235" y="469" class="xs" text-anchor="middle">Rf 3.6k</text>
  <line x1="320" y1="478" x2="320" y2="530" class="sig"/>
  <!-- output -->
  <line x1="250" y1="530" x2="320" y2="530" class="verde"/>
  <circle cx="320" cy="530" r="2.3" class="dot"/>
  <rect x="337" y="524" width="36" height="12" class="res"/><text x="355" y="520" class="xs" text-anchor="middle">R 150</text>
  <line x1="320" y1="530" x2="337" y2="530" class="verde"/>
  <line x1="373" y1="530" x2="410" y2="530" class="verde"/>
  <circle cx="410" cy="530" r="2.3" class="dot"/>
  <text x="418" y="526" class="xs">→ pin node 4</text>
  <!-- zener -->
  <rect x="403" y="542" width="14" height="30" class="res"/><text x="422" y="556" class="xs">Z 5.1V</text>
  <line x1="410" y1="530" x2="410" y2="542" class="verde"/>
  <line x1="410" y1="572" x2="410" y2="618" class="gnd"/>
  <!-- gnd tie -->
  <line x1="160" y1="618" x2="410" y2="618" class="gnd"/>
  <text x="235" y="614" class="xs">a GND común</text>
  <!-- power notes -->
  <text x="280" y="498" class="xs">Vcc (pin 8) = +11 V</text>
  <text x="280" y="566" class="xs">V− (pin 4) = GND</text>

  <!-- LM358 pinout inset -->
  <rect x="535" y="436" width="130" height="118" fill="#fff" stroke="#999"/>
  <text x="600" y="454" class="sm" text-anchor="middle" font-weight="bold">LM358 (8-DIP)</text>
  <rect x="582" y="462" width="36" height="74" fill="#ddd" stroke="#333"/>
  <text x="578" y="476" class="xs" text-anchor="end">1 OUT1</text>
  <text x="578" y="493" class="xs" text-anchor="end">2 IN1−</text>
  <text x="578" y="510" class="xs" text-anchor="end">3 IN1+</text>
  <text x="578" y="527" class="xs" text-anchor="end">4 V−(GND)</text>
  <text x="622" y="476" class="xs">8 Vcc(+11)</text>
  <text x="622" y="493" class="xs">7 OUT2</text>
  <text x="622" y="510" class="xs">6 IN2−</text>
  <text x="622" y="527" class="xs">5 IN2+</text>
  <text x="600" y="549" class="xs" text-anchor="middle">verde 3/2/1 · café 5/6/7</text>

  <!-- BOM -->
  <rect x="535" y="562" width="450" height="74" fill="#eef3fb" stroke="#9ab"/>
  <text x="547" y="580" class="tb">Lista (final, ESP controla)</text>
  <text x="547" y="597" class="xs">1× LM358  ·  2× R 10k (Rg)  ·  2× R 3.6k (Rf)  ·  2× R 150Ω  ·  2× zener 5.1V</text>
  <text x="547" y="612" class="xs">0 potes (θ por software). Ganancia G se afina en el sketch tras validar.</text>
  <text x="547" y="627" class="xs">Ya tenés: ESP32, power bank 5V. (Opcional: 2 trimpot si querés ajustar G por hardware.)</text>

  <!-- legend -->
  <rect x="45" y="648" width="940" height="60" fill="#fffbe6" stroke="#d9c76a"/>
  <text x="57" y="666" class="xs"><tspan font-weight="bold">Colores:</tspan>  rojo +5V (power bank→ESP) · naranja +11V (blanco→op-amp) · negro GND (amarillo) · verde señal cos · café señal sin · azul lógica/realim.</text>
  <text x="57" y="682" class="xs">LM358 NO es rail-to-rail → Vcc=+11V (del blanco, libre porque el sensor real se desconecta; a 5V no llega a 4.5V). Clamp = R150 + zener 5.1V.</text>
  <text x="57" y="698" class="xs">Si hay LMV358/TLV2372/MCP602 (rail-to-rail): op-amp a 5V y se quita el +11V y el zener. VALIDAR con el caracterizador (círculo radio≈1.95) antes de node 4.</text>
</svg>
