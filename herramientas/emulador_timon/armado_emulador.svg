<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 710" font-family="Helvetica,Arial,sans-serif">
  <style>
    .box{fill:#f6f8fa;stroke:#333;stroke-width:1.5}
    .chip{fill:#eef3fb;stroke:#2a4b7c;stroke-width:1.5}
    .res{fill:#fff;stroke:#333;stroke-width:1.2}
    .tb{font-size:14px;font-weight:bold;fill:#111}
    .sm{font-size:11px;fill:#444}
    .xs{font-size:10px;fill:#555}
    .pwr{stroke:#d81e2c;stroke-width:2.4;fill:none}
    .v11{stroke:#e8820c;stroke-width:2.4;fill:none}
    .gnd{stroke:#222;stroke-width:2.4;fill:none}
    .verde{stroke:#1a9e1a;stroke-width:2.4;fill:none}
    .cafe{stroke:#8a5a2b;stroke-width:2.4;fill:none}
    .sig{stroke:#1763d6;stroke-width:1.8;fill:none}
    .amar{stroke:#c9a200;stroke-width:2.4;fill:none}
    .dot{fill:#222}
    .dash{stroke:#8a5a2b;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
  </style>

  <text x="26" y="26" class="tb" font-size="18">Emulador del timón — versión LM358 (op-amp a +11 V del blanco, sin relé)</text>
  <text x="26" y="45" class="sm">verde = 2.47 + 1.98·cos θ   ·   café = 2.47 + 1.98·sin θ.   Ganancia G = 1+Rf/Rg = 1.36 (DAC 0-3.3 V → 0-4.5 V).</text>

  <!-- rails -->
  <line x1="75" y1="70" x2="360" y2="70" class="pwr"/>
  <text x="77" y="64" class="tb" fill="#d81e2c">+5 V (power bank → ESP)</text>
  <line x1="55" y1="662" x2="1015" y2="662" class="gnd"/>
  <text x="57" y="682" class="tb">GND común = amarillo del conector (único hilo de masa al equipo)</text>

  <!-- power bank -->
  <rect x="45" y="330" width="85" height="80" rx="6" class="box"/>
  <text x="87" y="365" class="sm" text-anchor="middle">POWER</text>
  <text x="87" y="380" class="sm" text-anchor="middle">BANK 5V</text>
  <line x1="87" y1="330" x2="87" y2="70" class="pwr"/>
  <line x1="87" y1="410" x2="87" y2="662" class="gnd"/>
  <circle cx="87" cy="70" r="3.3" class="dot"/><circle cx="87" cy="662" r="3.3" class="dot"/>

  <!-- pote -->
  <rect x="150" y="85" width="145" height="38" rx="6" class="box"/>
  <text x="222" y="109" class="sm" text-anchor="middle">POTE 10k — velocidad</text>
  <line x1="172" y1="123" x2="172" y2="140" class="pwr"/><text x="172" y="153" class="xs" text-anchor="middle">3V3</text>
  <line x1="272" y1="123" x2="272" y2="140" class="gnd"/><text x="272" y="153" class="xs" text-anchor="middle">GND</text>
  <path d="M222,123 L222,138 L335,138 L335,225 L345,225" class="sig"/>

  <!-- ESP32 -->
  <rect x="150" y="160" width="150" height="320" rx="4" class="chip"/>
  <text x="225" y="184" class="tb" text-anchor="middle" fill="#2a4b7c">ESP32</text>
  <line x1="185" y1="160" x2="185" y2="70" class="pwr"/><text x="191" y="176" class="xs">5V</text>
  <circle cx="185" cy="70" r="3.3" class="dot"/>
  <line x1="185" y1="480" x2="185" y2="662" class="gnd"/><text x="191" y="497" class="xs">GND</text>
  <circle cx="185" cy="662" r="3.3" class="dot"/>
  <path d="M150,205 L135,205 L135,133 L172,133 L172,123" class="pwr"/><text x="112" y="201" class="xs">3V3</text>
  <text x="294" y="229" class="xs" text-anchor="end">GPIO34 ← pote</text>
  <line x1="300" y1="225" x2="345" y2="225" class="sig"/>
  <text x="294" y="299" class="xs" text-anchor="end">GPIO25 verde</text>
  <line x1="300" y1="300" x2="345" y2="300" class="verde"/>
  <text x="294" y="384" class="xs" text-anchor="end">GPIO26 café</text>
  <line x1="300" y1="385" x2="345" y2="385" class="cafe"/>

  <!-- VERDE channel (detallado) -->
  <text x="470" y="250" class="tb" fill="#1a9e1a">Canal VERDE (U1a)</text>
  <!-- opamp triangle -->
  <path d="M470,258 L470,328 L540,293 Z" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="486" y="297" class="xs">U1a</text>
  <text x="462" y="279" class="sm">+</text>
  <text x="462" y="320" class="sm">−</text>
  <!-- DAC25 to + input -->
  <path d="M345,300 L430,300 L430,275 L470,275" class="verde"/>
  <circle cx="470" cy="275" r="2.5" class="dot"/>
  <!-- - input junction -->
  <path d="M470,311 L440,311" class="sig"/>
  <circle cx="440" cy="311" r="2.5" class="dot"/>
  <!-- Rg to gnd -->
  <rect x="433" y="330" width="14" height="30" class="res"/><text x="455" y="349" class="xs">Rg 10k</text>
  <line x1="440" y1="311" x2="440" y2="330" class="sig"/>
  <line x1="440" y1="360" x2="440" y2="372" class="gnd"/>
  <!-- Rf feedback -->
  <path d="M440,311 L440,238 L575,238" class="sig"/>
  <rect x="478" y="232" width="56" height="12" class="res"/><text x="506" y="229" class="xs" text-anchor="middle">Rf 3k6 (trim)</text>
  <line x1="575" y1="238" x2="575" y2="293" class="sig"/>
  <!-- output -->
  <line x1="540" y1="293" x2="575" y2="293" class="verde"/>
  <circle cx="575" cy="293" r="2.5" class="dot"/>
  <rect x="592" y="287" width="34" height="12" class="res"/><text x="609" y="283" class="xs" text-anchor="middle">R 150</text>
  <line x1="575" y1="293" x2="592" y2="293" class="verde"/>
  <line x1="626" y1="293" x2="662" y2="293" class="verde"/>
  <circle cx="662" cy="293" r="2.5" class="dot"/>
  <!-- zener -->
  <rect x="655" y="305" width="14" height="30" class="res"/><text x="690" y="318" class="xs">Z 5.1V</text>
  <text x="690" y="331" class="xs">(cátodo arriba)</text>
  <line x1="662" y1="293" x2="662" y2="305" class="verde"/>
  <line x1="662" y1="335" x2="662" y2="372" class="gnd"/>
  <!-- gnd tie verde -->
  <line x1="440" y1="372" x2="662" y2="372" class="gnd"/>
  <line x1="413" y1="372" x2="440" y2="372" class="gnd"/>
  <line x1="413" y1="372" x2="413" y2="662" class="gnd"/>
  <circle cx="413" cy="662" r="3.3" class="dot"/>
  <!-- verde out to connector -->
  <line x1="662" y1="293" x2="852" y2="293" class="verde"/>

  <!-- CAFE channel (resumen) -->
  <rect x="430" y="408" width="270" height="74" rx="6" class="dash"/>
  <text x="565" y="428" class="tb" fill="#8a5a2b" text-anchor="middle">Canal CAFÉ (U1b) — idéntico</text>
  <text x="565" y="446" class="xs" text-anchor="middle">IN+ (pin 5) ← GPIO26 · IN− (6) · OUT (7)</text>
  <text x="565" y="461" class="xs" text-anchor="middle">mismo Rg 10k, Rf 3k6, R 150, Z 5.1V</text>
  <text x="565" y="476" class="xs" text-anchor="middle">Vcc(8)=+11V · V−(4)=GND</text>
  <path d="M345,385 L430,385 L430,420 L430,420" class="cafe"/>
  <line x1="700" y1="445" x2="852" y2="445" class="cafe"/>

  <!-- +11V from blanco to LM358 Vcc -->
  <path d="M852,315 L852,210 L520,210" class="v11"/>
  <text x="524" y="206" class="sm" fill="#e8820c">+11 V (blanco) → LM358 Vcc (pin 8).  V− (pin 4) = GND</text>

  <!-- connector -->
  <rect x="852" y="255" width="135" height="220" rx="6" class="box"/>
  <text x="919" y="279" class="tb" text-anchor="middle">CONECTOR</text>
  <text x="919" y="296" class="tb" text-anchor="middle">→ node 4</text>
  <circle cx="852" cy="293" r="3" class="dot"/><text x="860" y="289" class="xs">verde (señal)</text>
  <circle cx="852" cy="315" r="3" class="dot"/><text x="860" y="325" class="xs" fill="#999">blanco +11 V</text>
  <circle cx="852" cy="350" r="3" class="dot"/><text x="860" y="354" class="xs">amarillo → GND</text>
  <circle cx="852" cy="445" r="3" class="dot"/><text x="860" y="441" class="xs">café (señal)</text>
  <line x1="919" y1="475" x2="919" y2="662" class="amar"/>
  <circle cx="919" cy="662" r="3.3" class="dot"/>

  <!-- LM358 pinout inset -->
  <rect x="770" y="80" width="120" height="110" fill="#fff" stroke="#bbb"/>
  <text x="830" y="96" class="sm" text-anchor="middle" font-weight="bold">LM358 (8-DIP)</text>
  <rect x="812" y="104" width="36" height="74" fill="#ddd" stroke="#333"/>
  <text x="808" y="118" class="xs" text-anchor="end">1 OUT1</text>
  <text x="808" y="135" class="xs" text-anchor="end">2 IN1−</text>
  <text x="808" y="152" class="xs" text-anchor="end">3 IN1+</text>
  <text x="808" y="169" class="xs" text-anchor="end">4 V−(GND)</text>
  <text x="852" y="118" class="xs">8 Vcc(+11)</text>
  <text x="852" y="135" class="xs">7 OUT2</text>
  <text x="852" y="152" class="xs">6 IN2−</text>
  <text x="852" y="169" class="xs">5 IN2+</text>

  <!-- legend -->
  <rect x="55" y="520" width="300" height="135" fill="#fff" stroke="#bbb"/>
  <text x="67" y="540" class="tb">Referencias</text>
  <line x1="67" y1="556" x2="99" y2="556" class="pwr"/><text x="107" y="560" class="xs">+5 V (power bank, al ESP)</text>
  <line x1="67" y1="574" x2="99" y2="574" class="v11"/><text x="107" y="578" class="xs">+11 V (blanco, al op-amp)</text>
  <line x1="67" y1="592" x2="99" y2="592" class="gnd"/><text x="107" y="596" class="xs">GND común (amarillo)</text>
  <line x1="67" y1="610" x2="99" y2="610" class="verde"/><text x="107" y="614" class="xs">señal verde (cos)</text>
  <line x1="67" y1="628" x2="99" y2="628" class="cafe"/><text x="107" y="632" class="xs">señal café (sin)</text>
  <line x1="67" y1="646" x2="99" y2="646" class="sig"/><text x="107" y="650" class="xs">realimentación / lógica</text>

  <!-- notes -->
  <rect x="375" y="520" width="612" height="100" fill="#fffbe6" stroke="#d9c76a"/>
  <text x="387" y="539" class="sm" font-weight="bold">Notas</text>
  <text x="387" y="557" class="xs">· LM358 NO es rail-to-rail: por eso Vcc = +11 V (del blanco, libre porque el sensor real se desconecta). A 5 V no llegaría a 4.5 V.</text>
  <text x="387" y="573" class="xs">· El op-amp chupa ~2 mA, dentro del presupuesto del riel del sensor (~15 mA). Zener 5.1 V + R 150 Ω = clamp (protege node 4 si el op-amp se dispara).</text>
  <text x="387" y="589" class="xs">· Si en C&amp;D hay un LMV358 / TLV2372 / MCP602 (rail-to-rail): corré el op-amp a 5 V del power bank y quitá el +11 V y el zener.</text>
  <text x="387" y="605" class="xs">· VALIDAR: salida → caracterizador (A0/A1). Mismo círculo (radio ≈ 1.95, nrad ≈ 1), afinar Rf, ANTES de conectar a node 4. Equipo parado, paro en mano.</text>
</svg>
