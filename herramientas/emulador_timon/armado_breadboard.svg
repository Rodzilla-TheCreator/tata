<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Helvetica,Arial,sans-serif">
  <style>
    .tb{font-size:14px;font-weight:bold;fill:#111}
    .sm{font-size:11px;fill:#222}
    .xs{font-size:10px;fill:#444}
    .pin{font-size:9px;fill:#fff}
    .col{font-size:9px;fill:#888}
    .row{stroke:#cfcfcf;stroke-width:1;stroke-dasharray:2 4}
    .red{stroke:#d81e2c;stroke-width:2.4;fill:none}
    .blue{stroke:#1763d6;stroke-width:2.4;fill:none}
    .verde{stroke:#1a9e1a;stroke-width:2.4;fill:none}
    .cafe{stroke:#8a5a2b;stroke-width:2.4;fill:none}
    .lead{stroke:#333;stroke-width:1.6;fill:none}
    .rb{fill:#e8c9a0;stroke:#8a6d3b;stroke-width:1}
    .zb{fill:#2b2b2b;stroke:#000;stroke-width:1}
    .dot{fill:#222}
  </style>

  <text x="24" y="26" class="tb" font-size="17">Emulador del timón — montaje en breadboard (LM358, ambos canales iguales)</text>
  <text x="24" y="44" class="xs">Rg 10k · Rf 5.1k (G=1.51) · R serie 100Ω · zener 5.1V (1N4733A) — mismos en verde y café. θ lo manda el ESP por serial.</text>

  <!-- breadboard body -->
  <rect x="40" y="70" width="640" height="380" rx="8" fill="#fbf7ef" stroke="#cbb89a"/>

  <!-- power rails -->
  <line x1="90" y1="92" x2="660" y2="92" class="red"/>
  <line x1="90" y1="112" x2="660" y2="112" class="blue"/>
  <line x1="90" y1="408" x2="660" y2="408" class="blue"/>
  <line x1="90" y1="428" x2="660" y2="428" class="red"/>
  <text x="48" y="96" class="xs" fill="#d81e2c">+11V</text>
  <text x="48" y="116" class="xs" fill="#1763d6">GND</text>
  <text x="48" y="412" class="xs" fill="#1763d6">GND</text>
  <text x="48" y="432" class="xs" fill="#d81e2c">+11V</text>
  <!-- rail links -->
  <line x1="78" y1="92" x2="78" y2="428" class="red"/>
  <line x1="88" y1="112" x2="88" y2="408" class="blue"/>

  <!-- row guide lines (a-e top, f-j bottom) -->
  <line x1="270" y1="152" x2="560" y2="152" class="row"/><text x="256" y="155" class="col">a</text>
  <line x1="270" y1="174" x2="560" y2="174" class="row"/><text x="256" y="177" class="col">b</text>
  <line x1="270" y1="196" x2="560" y2="196" class="row"/><text x="256" y="199" class="col">c</text>
  <line x1="270" y1="218" x2="560" y2="218" class="row"/><text x="256" y="221" class="col">d</text>
  <line x1="270" y1="240" x2="560" y2="240" class="row"/><text x="256" y="243" class="col">e</text>
  <rect x="270" y="251" width="290" height="12" fill="#eee"/>
  <line x1="270" y1="275" x2="560" y2="275" class="row"/><text x="256" y="278" class="col">f</text>
  <line x1="270" y1="297" x2="560" y2="297" class="row"/><text x="256" y="300" class="col">g</text>
  <line x1="270" y1="319" x2="560" y2="319" class="row"/><text x="256" y="322" class="col">h</text>
  <line x1="270" y1="341" x2="560" y2="341" class="row"/><text x="256" y="344" class="col">i</text>
  <line x1="270" y1="363" x2="560" y2="363" class="row"/><text x="256" y="366" class="col">j</text>

  <!-- column numbers -->
  <text x="300" y="140" class="col" text-anchor="middle">6</text>
  <text x="346" y="140" class="col" text-anchor="middle">7</text>
  <text x="392" y="140" class="col" text-anchor="middle">8</text>
  <text x="438" y="140" class="col" text-anchor="middle">9</text>
  <text x="484" y="140" class="col" text-anchor="middle">10</text>
  <text x="530" y="140" class="col" text-anchor="middle">11</text>

  <!-- LM358 IC straddling groove (pin1 at right / col9 top) -->
  <rect x="286" y="245" width="166" height="24" rx="3" fill="#333"/>
  <text x="369" y="261" class="pin" text-anchor="middle">LM358</text>
  <circle cx="444" cy="251" r="3" fill="#888"/>
  <!-- top pins row e -->
  <text x="300" y="238" class="col" text-anchor="middle" fill="#555">4</text>
  <text x="346" y="238" class="col" text-anchor="middle" fill="#555">3</text>
  <text x="392" y="238" class="col" text-anchor="middle" fill="#555">2</text>
  <text x="438" y="238" class="col" text-anchor="middle" fill="#555">1</text>
  <!-- bottom pins row f -->
  <text x="300" y="283" class="col" text-anchor="middle" fill="#555">5</text>
  <text x="346" y="283" class="col" text-anchor="middle" fill="#555">6</text>
  <text x="392" y="283" class="col" text-anchor="middle" fill="#555">7</text>
  <text x="438" y="283" class="col" text-anchor="middle" fill="#555">8</text>

  <!-- ============ VERDE (arriba) ============ -->
  <!-- DAC verde in -> C7 row a (pin3 IN1+) -->
  <line x1="346" y1="84" x2="346" y2="152" class="verde"/>
  <circle cx="346" cy="152" r="2.6" class="dot"/>
  <text x="352" y="90" class="xs" fill="#1a9e1a">DAC verde (GPIO25)</text>
  <!-- Rf 5.1k : C8 rowB - C9 rowB (pin2-pin1) -->
  <line x1="392" y1="174" x2="402" y2="174" class="lead"/>
  <rect x="402" y="168" width="26" height="12" class="rb"/>
  <line x1="428" y1="174" x2="438" y2="174" class="lead"/>
  <circle cx="392" cy="174" r="2.6" class="dot"/><circle cx="438" cy="174" r="2.6" class="dot"/>
  <text x="415" y="165" class="xs" text-anchor="middle">Rf 5.1k</text>
  <!-- Rg 10k : C8 rowA - top GND rail -->
  <line x1="392" y1="152" x2="392" y2="130" class="lead"/>
  <rect x="385" y="118" width="14" height="12" class="rb"/>
  <line x1="392" y1="118" x2="392" y2="112" class="lead"/>
  <circle cx="392" cy="152" r="2.6" class="dot"/><circle cx="392" cy="112" r="2.6" class="dot"/>
  <text x="402" y="130" class="xs">Rg 10k</text>
  <!-- R100 : C9 rowC - C11 rowC (pin1 -> salida) -->
  <line x1="438" y1="196" x2="470" y2="196" class="lead"/>
  <rect x="470" y="190" width="26" height="12" class="rb"/>
  <line x1="496" y1="196" x2="530" y2="196" class="lead"/>
  <circle cx="438" cy="196" r="2.6" class="dot"/><circle cx="530" cy="196" r="2.6" class="dot"/>
  <text x="483" y="187" class="xs" text-anchor="middle">R 100</text>
  <!-- Z1 5.1V : C11 rowA - top GND rail (catodo hacia C11/senal) -->
  <line x1="530" y1="152" x2="530" y2="140" class="lead"/>
  <rect x="523" y="124" width="14" height="16" class="zb"/>
  <line x1="523" y1="137" x2="537" y2="137" stroke="#ccc" stroke-width="2"/>
  <line x1="530" y1="124" x2="530" y2="112" class="lead"/>
  <circle cx="530" cy="152" r="2.6" class="dot"/><circle cx="530" cy="112" r="2.6" class="dot"/>
  <text x="540" y="138" class="xs">Z 5.1V</text>
  <!-- verde out : C11 rowD -> derecha -->
  <line x1="530" y1="218" x2="640" y2="218" class="verde"/>
  <circle cx="530" cy="218" r="2.6" class="dot"/>
  <text x="586" y="213" class="xs" fill="#1a9e1a">→ verde (node 4)</text>
  <!-- pin4 GND : C6 rowC - top GND rail -->
  <line x1="300" y1="196" x2="300" y2="112" class="blue"/>
  <circle cx="300" cy="196" r="2.6" class="dot"/><circle cx="300" cy="112" r="2.6" class="dot"/>
  <text x="258" y="183" class="xs">pin4→GND</text>

  <!-- ============ CAFE (abajo) ============ -->
  <!-- DAC cafe in -> C6 row j (pin5 IN2+) -->
  <line x1="300" y1="363" x2="300" y2="446" class="cafe"/>
  <circle cx="300" cy="363" r="2.6" class="dot"/>
  <text x="200" y="455" class="xs" fill="#8a5a2b">DAC café (GPIO26)</text>
  <!-- Rf 5.1k : C7 rowG - C8 rowG (pin6-pin7) -->
  <line x1="346" y1="297" x2="356" y2="297" class="lead"/>
  <rect x="356" y="291" width="26" height="12" class="rb"/>
  <line x1="382" y1="297" x2="392" y2="297" class="lead"/>
  <circle cx="346" cy="297" r="2.6" class="dot"/><circle cx="392" cy="297" r="2.6" class="dot"/>
  <text x="369" y="289" class="xs" text-anchor="middle">Rf 5.1k</text>
  <!-- Rg 10k : C7 rowI - bottom GND rail -->
  <line x1="346" y1="341" x2="346" y2="388" class="lead"/>
  <rect x="339" y="388" width="14" height="12" class="rb"/>
  <line x1="346" y1="400" x2="346" y2="408" class="lead"/>
  <circle cx="346" cy="341" r="2.6" class="dot"/><circle cx="346" cy="408" r="2.6" class="dot"/>
  <text x="356" y="384" class="xs">Rg 10k</text>
  <!-- R100 : C8 rowH - C10 rowH (pin7 -> salida) -->
  <line x1="392" y1="319" x2="424" y2="319" class="lead"/>
  <rect x="424" y="313" width="26" height="12" class="rb"/>
  <line x1="450" y1="319" x2="484" y2="319" class="lead"/>
  <circle cx="392" cy="319" r="2.6" class="dot"/><circle cx="484" cy="319" r="2.6" class="dot"/>
  <text x="437" y="311" class="xs" text-anchor="middle">R 100</text>
  <!-- Z2 5.1V : C10 rowJ - bottom GND rail (catodo/banda hacia C10/senal) -->
  <line x1="484" y1="363" x2="484" y2="388" class="lead"/>
  <rect x="477" y="388" width="14" height="16" class="zb"/>
  <line x1="477" y1="391" x2="491" y2="391" stroke="#ccc" stroke-width="2"/>
  <line x1="484" y1="404" x2="484" y2="408" class="lead"/>
  <circle cx="484" cy="363" r="2.6" class="dot"/><circle cx="484" cy="408" r="2.6" class="dot"/>
  <text x="494" y="382" class="xs">Z 5.1V</text>
  <!-- cafe out : C10 rowI -> derecha -->
  <line x1="484" y1="341" x2="640" y2="341" class="cafe"/>
  <circle cx="484" cy="341" r="2.6" class="dot"/>
  <text x="560" y="336" class="xs" fill="#8a5a2b">→ café (node 4)</text>
  <!-- pin8 Vcc : C9 rowJ - bottom +11V rail (outer) -->
  <line x1="438" y1="363" x2="438" y2="428" class="red"/>
  <circle cx="438" cy="363" r="2.6" class="dot"/><circle cx="438" cy="428" r="2.6" class="dot"/>
  <text x="434" y="398" class="xs" text-anchor="end">pin8→+11V</text>

  <!-- feeds -->
  <line x1="660" y1="428" x2="700" y2="428" class="red"/><text x="664" y="442" class="xs" fill="#d81e2c">+11V (blanco)</text>
  <line x1="660" y1="112" x2="700" y2="112" class="blue"/><text x="664" y="106" class="xs" fill="#1763d6">GND (amarillo)</text>

  <!-- notas -->
  <rect x="40" y="466" width="820" height="28" fill="#fffbe6" stroke="#d9c76a"/>
  <text x="50" y="479" class="xs">IC pin1 arriba-derecha (col 9, lado del punto). Verde arriba (pines 1/2/3), café abajo (pines 5/6/7). Vcc(8)=+11V, V−(4)=GND.</text>
  <text x="50" y="491" class="xs">Validar: salida verde/café → caracterizador (A0/A1), afinar G en el sketch (círculo radio≈1.95). ESP alimentado por power bank 5V, tierra común = amarillo. Equipo parado.</text>
</svg>
